inserisci_allarme:
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.porta_ingresso
      state:
      - 'off'
      for:
        hours: 0
        minutes: 0
        seconds: 5
    then:
    - choose:
      - conditions:
        - condition: state
          entity_id: binary_sensor.porta_filippo
          state:
          - 'on'
        sequence:
        - type: turn_on
          device_id: 53235eed42e9a9b62df4256c9eb0f8ea
          entity_id: e50ba8f6e4984b606e3436c95b54851f
          domain: switch
        - action: notify.mobile_app_iphone_di_filippo
          metadata: {}
          data:
            message: Esclusione automatica porta Filippo
      - conditions:
        - condition: state
          entity_id: binary_sensor.porta_mirella
          state:
          - 'on'
        sequence:
        - type: turn_on
          device_id: b6f6b1e60bcaa6325afd65659fdf377d
          entity_id: 859f90778ad3d34f50a34aa7d15e57dd
          domain: switch
        - action: notify.mobile_app_iphone_di_filippo
          metadata: {}
          data:
            message: Esclusione automatica porta Mirella
    - device_id: b1801aea27f8c2682b8779dec10a12a9
      domain: alarm_control_panel
      entity_id: b6424d6d88b000d316f25ccd0115edba
      type: arm_away
    - device_id: c903568bd46a79a3a35fa7b1b525f410
      domain: alarm_control_panel
      entity_id: 2ec10de0856b2123971150e778619ac3
      type: arm_away
    - device_id: df67f423d0dca29c15c6f8212f0bdb44
      domain: alarm_control_panel
      entity_id: e8fd23e13aba94ed0c523bb89d2f9a38
      type: arm_away
    else:
    - device_id: b1801aea27f8c2682b8779dec10a12a9
      domain: alarm_control_panel
      entity_id: b6424d6d88b000d316f25ccd0115edba
      type: arm_away
    - device_id: c903568bd46a79a3a35fa7b1b525f410
      domain: alarm_control_panel
      entity_id: 2ec10de0856b2123971150e778619ac3
      type: arm_away
    - device_id: df67f423d0dca29c15c6f8212f0bdb44
      domain: alarm_control_panel
      entity_id: e8fd23e13aba94ed0c523bb89d2f9a38
      type: arm_away
  alias: Allarma tutte le zone
  description: ''
arm_night:
