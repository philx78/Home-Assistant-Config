kblue_termostato_comando:
  alias: KBlue - Comando termostato
  description: 'Invia un comando a un termostato KBlue (setpoint manuale, auto, on,
    off). Le chiamate sono accodate (mai due scritture in parallelo). La conferma
    e'' fatta dallo script di shell, che dopo la scrittura rilegge il termostato direttamente
    dal KBlue (max circa 6 secondi) e, se non vede il valore atteso, esce con codice
    3: qui compare una notifica. Il sensore indicato in refresh viene aggiornato una
    sola volta, subito dopo la scrittura.'
  mode: queued
  max: 30
  fields:
    ixogm:
      description: ixogm del termostato (es. 0000008100000642)
      example: 0000008100000642
    azione:
      description: temperatura (es. 21.5) oppure auto / on / off
      example: '21.5'
    ixv:
      description: non piu' necessario, ignorato (ixm e ixv vengono letti dal KBlue
        dallo script)
      example: ''
    refresh:
      description: un sensore REST della risorsa termostati da aggiornare dopo la
        scrittura
      example: sensor.temperatura_salone_kblue
    verifica:
      description: non piu' usato (la conferma e' fatta dallo script di shell), accettato
        per compatibilita' con i chiamanti
      example: sensor.target_temperatura_salone_kblue
    stato:
      description: non piu' usato (la conferma e' fatta dallo script di shell), accettato
        per compatibilita' con i chiamanti
      example: sensor.stato_termostato_salone_kblue
    manuale:
      description: non piu' usato (la conferma e' fatta dallo script di shell), accettato
        per compatibilita' con i chiamanti
      example: sensor.modo_manuale_salone_kblue
  sequence:
  - action: shell_command.kblue_termostato
    data:
      ixogm: '{{ ixogm }}'
      azione: '{{ azione }}'
      ixv: '{{ ixv | default('''') }}'
    response_variable: esito
  - if:
    - condition: template
      value_template: '{{ refresh is defined }}'
    then:
    - action: homeassistant.update_entity
      target:
        entity_id: '{{ refresh }}'
  - if:
    - condition: template
      value_template: '{{ esito.returncode != 0 }}'
    then:
    - action: persistent_notification.create
      data:
        title: '{{ ''KBlue - comando non confermato'' if esito.returncode == 3 else
          ''KBlue - comando termostato fallito'' }}'
        message: 'Termostato {{ ixogm }}, azione "{{ azione }}": {{ (esito.stderr
          | default('''') | trim) or ''errore sconosciuto'' }} Risposta del KBlue:
          {{ (esito.stdout | default('''') | string | trim)[:300] or ''nessuna'' }}'
        notification_id: kblue_errore_comando
    - stop: Comando KBlue non riuscito
      error: true
pausa_armo_automatico_2:
  alias: Pausa armo automatico
  mode: restart
  fields:
    ore:
      name: Ore
      description: Durata della pausa in ore
      default: 3
      selector:
        number:
          min: 0.5
          max: 12
          step: 0.5
  sequence:
  - action: automation.turn_off
    target:
      entity_id: automation.presence_attivazione_allarme_quando_nessuno_a_casa
    data:
      stop_actions: true
  - action: timer.start
    target:
      entity_id: timer.pausa_armo_automatico
    data:
      duration: '{{ (ore | float(3) * 3600) | int }}'
  - action: telegram_bot.send_message
    data:
      entity_id:
      - notify.homeassistant_filippo_8511463273
      message: ⏸️ Armo automatico in pausa fino alle {{ (now() + timedelta(hours=ore
        | float(3))).strftime('%H:%M') }}
  description: ''
ripristina_armo_automatico:
  alias: Ripristina armo automatico
  mode: single
  sequence:
  - action: timer.cancel
    target:
      entity_id: timer.pausa_armo_automatico
  - action: automation.turn_on
    target:
      entity_id: automation.presence_attivazione_allarme_quando_nessuno_a_casa
    data: {}
  - action: telegram_bot.send_message
    data:
      entity_id:
      - notify.homeassistant_filippo_8511463273
      message: ▶️ Armo automatico ripristinato
  - if:
    - condition: state
      entity_id: input_boolean.presence
      state: 'off'
    - condition: state
      entity_id: alarm_control_panel.risco_casetta_partition_1
      state: disarmed
    then:
    - action: automation.trigger
      target:
        entity_id: automation.sicurezza_inserisci_allarme_quando_non_viene_rilevata_presenza_in_casa
      data:
        skip_condition: true
  description: ''
backup_config_ha:
  alias: Backup configurazione Home Assistant
  icon: mdi:content-save-cog
  mode: single
  sequence:
  - action: shell_command.backup_config
    response_variable: backup_result
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ backup_result.returncode == 0 }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: Backup configurazione completato
          notification_id: backup_config
          message: '{{ backup_result.stdout }}'
    default:
    - action: persistent_notification.create
      data:
        title: Backup configurazione FALLITO
        notification_id: backup_config
        message: 'Codice {{ backup_result.returncode }}: {{ backup_result.stdout }}
          {{ backup_result.stderr }}'
lavatrice_notifica_telegram_voce:
  alias: Lavatrice - Notifica Telegram + voce
  mode: queued
  fields:
    messaggio:
      name: Messaggio
      description: Testo per Telegram
      required: true
      selector:
        text:
          multiline: true
    voce:
      name: Voce
      description: Testo da pronunciare sull'Echo Show
      required: true
      selector:
        text:
          multiline: true
  sequence:
  - action: telegram_bot.send_message
    metadata: {}
    data:
      entity_id:
      - notify.notifiche_ha_condivise
      message: '{{ messaggio }}'
  - if:
    - condition: time
      after: 08:00:00
      before: '22:30:00'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.echo_show_speak
      data:
        message: '{{ voce | trim }}'
lavatrice_stato_a_voce:
  alias: Lavatrice - Stato a voce
  mode: single
  sequence:
  - variables:
      in_corso: '{{ is_state(''binary_sensor.lavatrice_running'', ''on'') }}'
      percentuale: '{{ states(''sensor.lavatrice_progress'') | float(0) | round(0)
        | int }}'
      minuti: '{{ states(''sensor.lavatrice_time_remaining'') | float(0) | round(0)
        | int }}'
      fine: '{{ (now() + timedelta(minutes=minuti)).strftime(''%H:%M'') }}'
      programma: '{{ states(''sensor.lavatrice_program'') }}'
      programma_noto: '{{ programma not in [''unknown'', ''unavailable'', ''none'',
        ''''] }}'
  - action: notify.send_message
    target:
      entity_id: notify.echo_show_speak
    data:
      message: "{% if in_corso %}\n  La lavatrice è al {{ percentuale }} per cento.\n
        \ {% if programma_noto %}Sta eseguendo il programma {{ programma }}.{% endif
        %}\n  {% if minuti > 0 %}Mancano circa {{ minuti }} minuti, la fine è prevista
        alle {{ fine.replace(':', ' e ') }}.{% endif %}\n{% else %}\n  La lavatrice
        non è in funzione.\n{% endif %}\n"
