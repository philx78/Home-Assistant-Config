# rest_sensors.yaml
# Sensori Termostati KBlue - Metodo REST
#
# Modifica 07/11/2026: nessuno zero "inventato" dopo un riavvio o con risposta incompleta.
#   Temperature, target, stato, riscaldamento, modo manuale e consumi:
#   se non c'e' ne' un valore nuovo valido ne' un valore precedente valido
#   il sensore resta "unknown" (nessun punto nello storico) invece di scrivere 0/off.
- resource: http://192.168.1.54:50080/request_json
  method: POST
  payload: 'command={"cmd":20,"schema":0,"idmp":14}'
  headers:
    Connection: "close"
    Content-Type: "application/x-www-form-urlencoded"
    Cookie: "user={{ states('sensor.kblue_user_cookie') }}; session={{ states('sensor.kblue_session_cookie') }}"
  scan_interval: 10

  # =====================================================================
  # REST SENSOR PER ESTRARRE I VALORI DI TEMPERATURA DALLA DOMOTICA KBLUE
  # =====================================================================
  sensor:
    # --- Stato della sessione KBlue (ok/ko). Serve all'automazione di rinnovo sessione:
    #     resta "ko" solo se il KBlue risponde senza OGGETTI (sessione non valida).
    - name: "Stato Sessione (KBlue)"
      unique_id: kblue_stato_sessione
      value_template: >
        {{ 'ok' if value_json.OGGETTI is defined else 'ko' }}
      icon: mdi:account-key

    # ==================================================
    # SENSORI ZONA GIORNO
    # ==================================================
    # --- SALONE (ixogm: 0000008100000642) ---
    - name: "Temperatura Salone (KBlue)"
      unique_id: kblue_temp_salone
      value_template: >
        {% set prec = states('sensor.temperatura_salone_kblue') | float(0) %}
        {% if value_json.OGGETTI is defined %}
          {% set oggetto = value_json.OGGETTI | selectattr('ixogm', 'eq', '0000008100000642') | first %}
          {% set nuovo = oggetto.V[2] | float(0) if oggetto is defined else 0 %}
          {{ nuovo if nuovo > 0 else (prec if prec > 0 else none) }}
        {% else %}
          {{ prec if prec > 0 else none }}
        {% endif %}
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
    - name: "Target Temperatura Salone (KBlue)"
      unique_id: kblue_target_salone
      value_template: >
        {% set prec = states('sensor.target_temperatura_salone_kblue') | float(0) %}
        {% if value_json.OGGETTI is defined %}
          {% set oggetto = value_json.OGGETTI | selectattr('ixogm', 'eq', '0000008100000642') | first %}
          {% set nuovo = oggetto.V[10] | float(0) if oggetto is defined else 0 %}
          {{ nuovo if nuovo > 0 else (prec if prec > 0 else none) }}
        {% else %}
          {{ prec if prec > 0 else none }}
        {% endif %}
      unit_of_measurement: "°C"
      icon: mdi:thermometer
    - name: "Stato Termostato Salone (KBlue)"
      unique_id: kblue_stato_salone
      value_template: >
        {% set prec = states('sensor.stato_termostato_salone_kblue') %}
        {% if value_json.OGGETTI is defined %}
          {% set oggetto = value_json.OGGETTI | selectattr('ixogm', 'eq', '0000008100000642') | first %}
          {% set valido = oggetto is defined and oggetto.V[2] | float(0) > 0 and oggetto.V[10] | float(0) > 0 %}
          {% if valido %}{{ 'on' if oggetto.V[0] == '1' else 'off' }}{% elif prec in ['on','off'] %}{{ prec }}{% else %}{{ none }}{% endif %}
        {% else %}
          {{ prec if prec in ['on','off'] else none }}
        {% endif %}
      icon: mdi:radiator
    - name: "Riscaldamento Attivo Salone (KBlue)"
      unique_id: kblue_heating_active_salone
      value_template: >
        {% set prec = states('sensor.riscaldamento_attivo_salone_kblue') %}
        {% if value_json.OGGETTI is defined %}
          {% set oggetto = value_json.OGGETTI | selectattr('ixogm', 'eq', '0000008100000642') | first %}
          {% set valido = oggetto is defined and oggetto.V[2] | float(0) > 0 and oggetto.V[10] | float(0) > 0 %}
          {% if valido %}{{ 'on' if oggetto.V[7] | int == 1 else 'off' }}{% elif prec in ['on','off'] %}{{ prec }}{% else %}{{ none }}{% endif %}
        {% else %}
          {{ prec if prec in ['on','off'] else none }}
        {% endif %}
      icon: >
        {% if value_json is defined and value_json.OGGETTI is defined %}
          {% set oggetto = value_json.OGGETTI | selectattr('ixogm', 'eq', '0000008100000642') | first %}
          {{ 'mdi:fire' if oggetto is defined and oggetto.V[7] | int == 1 else 'mdi:fire-off' }}
        {% else %}
          {{ 'mdi:fire' if is_state('sensor.riscaldamento_attivo_salone_kblue', 'on') else 'mdi:fire-off' }}
        {% endif %}
    - name: "Modo Manuale Salone (KBlue)"
      unique_id: kblue_modo_manuale_salone
      value_template: >
        {% set prec = states('sensor.modo_manuale_salone_kblue') %}
        {% if value_json.OGGETTI is defined %}
          {% set oggetto = value_json.OGGETTI | selectattr('ixogm', 'eq', '0000008100000642') | first %}
          {% set valido = oggetto is defined and oggetto.V[2] | float(0) > 0 and oggetto.V[10] | float(0) > 0 %}
          {% if valido %}{{ oggetto.V[12] }}{% elif prec not in ['unknown','unavailable'] %}{{ prec }}{% else %}{{ none }}{% endif %}
        {% else %}
          {{ prec if prec not in ['unknown','unavailable'] else none }}
        {% endif %}
      icon: mdi:hand-back-right

