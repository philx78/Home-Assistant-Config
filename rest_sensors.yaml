# ============================================
# Sensori REST per i consumi KBlue
# ============================================

- resource: "http://192.168.1.54:50080/request_json"
  method: POST
  scan_interval: 10
  headers:
    Connection: "close"
    Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
    # Assicurati che questi sensori (che leggono dal file) siano attivi
    Cookie: "user={{ states('sensor.kblue_user_cookie') }}; session={{ states('sensor.kblue_session_cookie') }}"
  # Payload confermato funzionante
  payload: '{"cmd":460}'

  sensor:
    # Consumo Fase L1
    - name: "Consumo L1"
      unique_id: consumo_l1_kblue
      value_template: >
        {% if value_json.SINOTTICI is defined %}
          {{ value_json.SINOTTICI[0].SEGNALI[0].V[0] | float(0) }}
        {% else %}
          {{ states('sensor.consumo_l1') if states('sensor.consumo_l1') not in ['unknown','unavailable'] else none }}
        {% endif %}
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      json_attributes_path: "$.SINOTTICI[0].SEGNALI[0]"
      json_attributes:
        - "alias"
        - "ixogm"

    # Consumo Fase L2
    - name: "Consumo L2"
      unique_id: consumo_l2_kblue
      value_template: >
        {% if value_json.SINOTTICI is defined %}
          {{ value_json.SINOTTICI[0].SEGNALI[1].V[0] | float(0) }}
        {% else %}
          {{ states('sensor.consumo_l2') if states('sensor.consumo_l2') not in ['unknown','unavailable'] else none }}
        {% endif %}
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement

    # Consumo Fase L3
    - name: "Consumo L3"
      unique_id: consumo_l3_kblue
      value_template: >
        {% if value_json.SINOTTICI is defined %}
          {{ value_json.SINOTTICI[0].SEGNALI[2].V[0] | float(0) }}
        {% else %}
          {{ states('sensor.consumo_l3') if states('sensor.consumo_l3') not in ['unknown','unavailable'] else none }}
        {% endif %}
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement

    # Consumo Totale Trifase (Sinottico 1)
    - name: "Consumo Totale"
      unique_id: consumo_totale_kblue
      value_template: >
        {% if value_json.SINOTTICI is defined and value_json.SINOTTICI|length > 1 %}
          {{ value_json.SINOTTICI[1].SEGNALI[0].V[0] | float(0) }}
        {% else %}
          {{ states('sensor.consumo_totale') if states('sensor.consumo_totale') not in ['unknown','unavailable'] else none }}
        {% endif %}
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement

# ============================================
# Sensore REST per stato luci KBlue
# ============================================

# ============================================
# Interrogazione Mappa CUCINA (idmp:6)
# ============================================

- resource: http://192.168.1.54:50080/request_json
  method: POST
  payload: 'command={"cmd":20,"schema":0,"idmp":6}'
  headers:
    Connection: "close"
    Content-Type: "application/x-www-form-urlencoded"
    Cookie: "user={{ states('sensor.kblue_user_cookie') }}; session={{ states('sensor.kblue_session_cookie') }}"
  scan_interval: 10

  sensor:
    # === ZONA GIORNO ===

    # Strip Salotto (ixogm: 0000008100000188 - variabile ixv:188)
    - name: "Stato Strip Salotto (KBlue)"
      unique_id: kblue_stato_strip_salotto
      value_template: >
        {% if value_json.OGGETTI is defined %}
          {% set obj = value_json.OGGETTI | selectattr('C', 'defined') | selectattr('C', 'contains', 188) | first | default(none) %}
          {% if obj and obj.V[0] | int > 0 %}on{% else %}off{% endif %}
        {% else %}
          {{ states('sensor.stato_strip_salotto_kblue') if states('sensor.stato_strip_salotto_kblue') not in ['unknown','unavailable'] else 'off' }}
        {% endif %}

    - name: "Brightness Strip Salotto (KBlue)"
      unique_id: kblue_brightness_strip_salotto
      value_template: >
        {% if value_json.OGGETTI is defined %}
          {% set obj = value_json.OGGETTI | selectattr('C', 'defined') | selectattr('C', 'contains', 188) | first | default(none) %}
