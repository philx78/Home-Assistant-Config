# ============================================================
# NOTE GENERALI
# ------------------------------------------------------------
# File incluso in configuration.yaml con:
#   rest_command: !include rest_commands.yaml
# La chiave rest_command: NON va ripetuta qui.
#
# Tutti i comandi usano il metodo POST verso:
#   http://192.168.1.54:50080/request_json
#
# Autenticazione tramite cookie di sessione KBlue:
#   user=    → sensor.kblue_user_cookie
#   session= → sensor.kblue_session_cookie
#
# Struttura payload:
#   cmd:31   → comando generico KBlue
#   ixm      → indice modulo (0=zona notte, 1=zona giorno, 2=suite)
#   ixv      → indice variabile (identifica il singolo dispositivo)
#   v        → valore del comando
#
# Convenzione valori per LUCI:
#   switch:  v=1 on  |  v=0 off
#   dimmer:  v=0..1000 (HA usa 0..255, convertito con formula brightness/255*1000)
#
# Convenzione valori per MOTORI (tapparelle, grate, tende):
#   v=2 → apri (su)  |  v=1 → chiudi (giù)  |  v=3 → stop
#   ECCEZIONE: pergotenda_suite usa ixv diversi per up e down (vedi sezione)
#
# Modifica 07/10/2026:
#   - corretto typo JSON in tapparella_bagno_grande_down ("VARIABILI">)
#   - aggiunto timeout: 5 ai comandi motori di zona giorno e zona notte
#     (prima mancava e usavano il timeout di default)
# ============================================================

claude_weather_forecast:
  url: "https://api.anthropic.com/v1/messages"
  method: POST
  headers:
    x-api-key: !secret anthropic_api_key
    anthropic-version: "2023-06-01"
    content-type: "application/json"
  payload: >
    {
      "model": "claude-haiku-4-5-20251001",
      "max_tokens": 256,
      "messages": [{
        "role": "user",
        "content": {{ message | tojson }}
      }]
    }

# ============================================================
# ZONA GIORNO — LUCI
# ixm: 1
# ============================================================

# --- Strip Salotto -------------------------------------------
# Tipo: dimmerabile (v: 0..1000)
# ixv: 188
kblue_strip_salotto_on:
  url: http://192.168.1.54:50080/request_json
  method: POST
  headers:
    Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
    Cookie: "user={{ states('sensor.kblue_user_cookie') }}; session={{ states('sensor.kblue_session_cookie') }}"
  payload: 'command={"cmd":31,"VARIABILI":[{"ixm":1,"ixv":188,"v":1000}]}'
  timeout: 5

kblue_strip_salotto_off:
  url: http://192.168.1.54:50080/request_json
  method: POST
  headers:
    Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
    Cookie: "user={{ states('sensor.kblue_user_cookie') }}; session={{ states('sensor.kblue_session_cookie') }}"
  payload: 'command={"cmd":31,"VARIABILI":[{"ixm":1,"ixv":188,"v":0}]}'
  timeout: 5

# brightness: valore 0-255 da HA, convertito in scala 0-1000 per KBlue
kblue_strip_salotto_brightness:
  url: http://192.168.1.54:50080/request_json
  method: POST
  headers:
    Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
    Cookie: "user={{ states('sensor.kblue_user_cookie') }}; session={{ states('sensor.kblue_session_cookie') }}"
  payload: 'command={"cmd":31,"VARIABILI":[{"ixm":1,"ixv":188,"v":{{ (brightness / 255 * 1000) | int }}}]}'
  timeout: 5

