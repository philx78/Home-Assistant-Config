# ============================================
# INTEGRATION SENSORS - Convertono Potenza in Energia
# ============================================
# Questi sensori integrano la potenza istantanea per calcolare l'energia consumata
# I sensori source sono in kW, quindi il risultato sarà in kWh

# Integrazione energia L1
- platform: integration
  source: sensor.consumo_l1
  name: energia_l1
  unique_id: energia_l1_integrata
  unit_time: h
  round: 3
  method: left

# Integrazione energia L2
- platform: integration
  source: sensor.consumo_l2
  name: energia_l2
  unique_id: energia_l2_integrata
  unit_time: h
  round: 3
  method: left

# Integrazione energia L3
- platform: integration
  source: sensor.consumo_l3
  name: energia_l3
  unique_id: energia_l3_integrata
  unit_time: h
  round: 3
  method: left

# Integrazione energia totale
- platform: integration
  source: sensor.consumo_totale
  name: energia_totale
  unique_id: energia_totale_integrata
  unit_time: h
  round: 3
  method: left

# ============================================
# STATISTICHE CONSUMO - Min/Max/Media Giornalieri
# ============================================

# Statistiche Min/Max/Media esistenti
- platform: statistics
  name: "Temperatura media frigo"
  unique_id: temperatura_media_frigo_statistics
  entity_id: sensor.temperatura_istantanea_frigo
  precision: 1
  sampling_size: 20
  max_age:
    hours: 2
  state_characteristic: average_linear

