# ==============================================================================
# STATISTICHE TEMPERATURA - Tutte le stanze
# Calcola la variazione di temperatura al secondo (change_second)
# su una finestra mobile di 30 minuti, utilizzata dai sensor trend
# in templates.yaml per derivare la velocità in °C/h
# ==============================================================================

- platform: statistics
  name: "Stats Temperatura Salone"
  entity_id: sensor.temperatura_attuale_salone
  state_characteristic: change
  max_age:
    minutes: 30
  sampling_size: 60

