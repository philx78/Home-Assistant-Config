# --- Posizione attuale Filippo (geocoding inverso via Nominatim/OSM) ----------
# Aggiorna ogni 5 minuti le coordinate di person.filippo_durzu in un nome
# leggibile (es. "Isola del Giglio, Grosseto"). Usato nel briefing meteo
# mattutino per identificare il luogo corretto quando fuori Roma.
- platform: rest
  name: "Posizione Filippo"
  unique_id: posizione_filippo
  resource_template: "https://nominatim.openstreetmap.org/reverse?lat={{ state_attr('person.filippo_durzu', 'latitude') }}&lon={{ state_attr('person.filippo_durzu', 'longitude') }}&format=json&zoom=10&accept-language=it"
  headers:
    User-Agent: "HomeAssistant"
  value_template: "{{ value_json.display_name }}"
  scan_interval: 300
