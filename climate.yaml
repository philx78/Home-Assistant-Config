# climate.yaml
# Integrazione termostati KBlue via climate_template (HACS)
#
# PRINCIPIO: il KBlue e' l'unica fonte di verita'.
#   Temperatura, target, stato e riscaldamento si leggono dai sensori "stabili" (templates.yaml),
#   che ignorano zeri e letture non valide e mantengono l'ultimo valore buono.
#   Se un sensore stabile non e' disponibile (unknown/unavailable) si usa il sensore grezzo
#   KBlue corrispondente: il climate non mostra mai 0 / Off solo perche' manca il sensore stabile.
#   - target / modo / stato si leggono SEMPRE dai sensori REST (aggiornati ogni 10 s),
#     quindi le modifiche fatte dal pannello a muro o dall'app KBlue compaiono in HA
#     senza che HA scriva nulla indietro (nessun input_number, nessuna automazione di sync).
#   - HA scrive sul KBlue solo quando e' l'utente a chiederlo da HA
#     (set_temperature / set_hvac_mode), tramite script.kblue_termostato_comando.
#   - Temperatura misurata al decimo di grado (precision 0.1), setpoint a passi di 0.5 (temp_step 0.5).
#
# MODELLO:
#   hvac_mode    : auto = acceso (programma orario o manuale) | off = spento
#   hvac_action  : heating = riscaldamento realmente in funzione (V[7] == 1) | idle | off
#   Modo MANUALE : non e' un modo HVAC. Si entra cambiando il setpoint (da HA, pannello o app) e si
#                  esce con "Auto". Lo stato si legge da sensor.modo_manuale_<zona>_kblue (V[12] != 0),
#                  da usare nelle dashboard (es. icona della gauge).
#
# Scrittura attiva su TUTTE le zone. Per auto/on/off lo script legge da solo, dalla voce del
# termostato nel KBlue, l'ixm e gli ixv (S[0] = on/off, S[12] = flag manuale): l'ixm cambia da
# zona a zona (Salone = 1, Cam Francesco = 0), quindi non vanno scritti a mano.

# === TERMOSTATO SALONE (controllo scrittura) ===
- platform: climate_template
  name: "Termostato Salone"
  unique_id: climate_salone
  current_temperature_template: "{{ (states('sensor.temperatura_stabile_salone') if has_value('sensor.temperatura_stabile_salone') else states('sensor.temperatura_salone_kblue')) | float(0) }}"
  target_temperature_template: "{{ (states('sensor.target_stabile_salone') if has_value('sensor.target_stabile_salone') else states('sensor.target_temperatura_salone_kblue')) | float(0) }}"
  min_temp: 16
  max_temp: 24
  precision: 0.1
  temp_step: 0.5
  modes:
    - "auto"
    - "off"
  hvac_mode_template: >
    {% set stato = (states('sensor.stato_stabile_salone') if has_value('sensor.stato_stabile_salone') else states('sensor.stato_termostato_salone_kblue')) | lower | trim %}
    {% if stato != 'on' %}
      off
    {% else %}
      auto
    {% endif %}
  hvac_action_template: >
    {% if (states('sensor.stato_stabile_salone') if has_value('sensor.stato_stabile_salone') else states('sensor.stato_termostato_salone_kblue')) | lower | trim != 'on' %}
      off
    {% elif (states('sensor.riscaldamento_stabile_salone') if has_value('sensor.riscaldamento_stabile_salone') else states('sensor.riscaldamento_attivo_salone_kblue')) | lower | trim == 'on' %}
      heating
    {% else %}
      idle
    {% endif %}
  set_temperature:
    - service: script.kblue_termostato_comando
      data:
        ixogm: "0000008100000642"
        azione: "{{ ((temperature | float(0)) * 2) | round(0) / 2 }}"
        refresh: sensor.temperatura_salone_kblue
        verifica: sensor.target_temperatura_salone_kblue
  set_hvac_mode:
    - choose:
        # AUTO: accende solo se e' spento, rimette il programma solo se e' in manuale
        - conditions:
            - condition: template
              value_template: "{{ hvac_mode == 'auto' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ (states('sensor.stato_stabile_salone') if has_value('sensor.stato_stabile_salone') else states('sensor.stato_termostato_salone_kblue')) != 'on' }}"
              then:
                - service: script.kblue_termostato_comando
                  data: {ixogm: "0000008100000642", azione: "on", refresh: sensor.temperatura_salone_kblue, stato: sensor.stato_termostato_salone_kblue, manuale: sensor.modo_manuale_salone_kblue}
            - if:
                - condition: template
                  value_template: "{{ states('sensor.modo_manuale_salone_kblue') != '0' }}"
              then:
                - service: script.kblue_termostato_comando
                  data: {ixogm: "0000008100000642", azione: "auto", refresh: sensor.temperatura_salone_kblue, stato: sensor.stato_termostato_salone_kblue, manuale: sensor.modo_manuale_salone_kblue}
        # OFF: spegne solo se e' acceso
        - conditions:
            - condition: template
              value_template: "{{ hvac_mode == 'off' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ (states('sensor.stato_stabile_salone') if has_value('sensor.stato_stabile_salone') else states('sensor.stato_termostato_salone_kblue')) == 'on' }}"
              then:
                - service: script.kblue_termostato_comando
                  data: {ixogm: "0000008100000642", azione: "off", refresh: sensor.temperatura_salone_kblue, stato: sensor.stato_termostato_salone_kblue, manuale: sensor.modo_manuale_salone_kblue}

