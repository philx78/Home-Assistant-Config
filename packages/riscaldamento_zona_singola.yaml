            {% else %}{% endif %}
  - triggers:
      - trigger: state
        entity_id: sensor.riscaldamento_attivo_wc_kblue
        to:
          - "on"
          - "off"
    sensor:
      - name: "Storico WC"
        unique_id: storico_riscaldamento_wc
        state: "{{ trigger.to_state.state }}"
        attributes:
          temperatura: "{{ state_attr('climate.termostato_wc', 'current_temperature') }}"
