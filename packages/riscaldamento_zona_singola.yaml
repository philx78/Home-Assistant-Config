  # Zona da trattenere (preventivo o ripiego): entity del termostato oppure "nessuna"
  - sensor:
      - name: "Zona da trattenere"
        unique_id: zona_da_trattenere
        state: >-
          {% set m = {
            'climate.termostato_salone': ['sensor.riscaldamento_attivo_salone_kblue', 'sensor.trend_temperatura_salone'],
            'climate.termostato_cucina': ['sensor.riscaldamento_attivo_cucina_kblue', 'sensor.trend_temperatura_cucina'],
            'climate.termostato_camera_francesco': ['sensor.riscaldamento_attivo_camera_francesco', 'sensor.trend_temperatura_camera_francesco'],
            'climate.termostato_camera_greta': ['sensor.riscaldamento_attivo_cam_greta_kblue', 'sensor.trend_temperatura_camera_greta'],
            'climate.termostato_camera_matrimoniale': ['sensor.riscaldamento_attivo_letto_kblue', 'sensor.trend_temperatura_camera_matrimoniale'],
            'climate.termostato_wc': ['sensor.riscaldamento_attivo_wc_kblue', 'sensor.trend_temperatura_wc'],
            'climate.termostato_wc_letto': ['sensor.riscaldamento_attivo_wc_letto_kblue', 'sensor.trend_temperatura_wc_letto'],
            'climate.termostato_suite_letto': ['sensor.riscaldamento_attivo_letto_suite_kblue', 'sensor.trend_temperatura_suite_letto'],
            'climate.termostato_suite_salone': ['sensor.riscaldamento_attivo_salone_suite_kblue', 'sensor.trend_temperatura_suite_salone'],
            'climate.termostato_wc_suite': ['sensor.riscaldamento_attivo_wc_suite_kblue', 'sensor.trend_temperatura_wc_suite']
          } %}
          {% set soglia = states('input_number.zona_soglia_vicinanza') | float(0.4) %}
          {% set n = states('sensor.zone_in_riscaldamento') | int(0) %}
          {% set unica = state_attr('sensor.zone_in_riscaldamento', 'unica') %}
          {% set ns = namespace(res='nessuna', cand=[]) %}
          {% if n == 1 %}
            {% if unica not in ['nessuna', 'climate.termostato_salone'] and states(unica) in ['auto', 'heat'] %}
              {% set ns.res = unica %}
            {% endif %}
          {% elif n == 0 %}
            {% for c, v in m.items() if c != 'climate.termostato_salone' %}
              {% set t = state_attr(c, 'current_temperature') | float(none) %}
              {% set sp = state_attr(c, 'temperature') | float(none) %}
              {% set cl = state_attr(v[1], 'classificazione') %}
              {% if states(c) in ['auto', 'heat'] and is_state(v[0], 'off')
                    and t is not none and t != 0 and sp is not none and t <= sp
                    and cl not in ['salita', 'salita_rapida'] %}
                {% set ns.cand = ns.cand + [c] %}
              {% endif %}
            {% endfor %}
            {% if ns.cand | count == 1 %}
              {% set c0 = ns.cand[0] %}
              {% set nr = namespace(vicina=false) %}
              {% for c, v in m.items() if c != c0 %}
                {% set t = state_attr(c, 'current_temperature') | float(none) %}
                {% set sp = state_attr(c, 'temperature') | float(none) %}
                {% set cl = state_attr(v[1], 'classificazione') %}
                {% if states(c) not in ['off', 'unavailable', 'unknown'] and is_state(v[0], 'off')
                      and t is not none and t != 0 and sp is not none %}
                  {% set d = t - sp %}
                  {% set pronta = d <= 0 and cl not in ['salita', 'salita_rapida'] %}
                  {% if pronta or (d <= soglia and (cl in ['discesa', 'discesa_rapida'] or (cl == 'stabile' and d <= 0.2))) %}
                    {% set nr.vicina = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% if not nr.vicina %}{% set ns.res = c0 %}{% endif %}
            {% endif %}
          {% endif %}
          {{ ns.res }}
        attributes:
          motivo: >-
            {{ 'ripiego' if states('sensor.zone_in_riscaldamento') | int(0) == 1 else 'preventivo' }}

  # Un'altra zona (Salone compreso) e' partita o ha raggiunto il setpoint
  # rispetto alla zona attualmente trattenuta: serve a rilasciarla.
  - binary_sensor:
      - name: "Zona altra in partenza"
        unique_id: zona_altra_in_partenza
        state: >-
          {% set m = {
            'climate.termostato_salone': ['sensor.riscaldamento_attivo_salone_kblue', 'sensor.trend_temperatura_salone'],
            'climate.termostato_cucina': ['sensor.riscaldamento_attivo_cucina_kblue', 'sensor.trend_temperatura_cucina'],
            'climate.termostato_camera_francesco': ['sensor.riscaldamento_attivo_camera_francesco', 'sensor.trend_temperatura_camera_francesco'],
            'climate.termostato_camera_greta': ['sensor.riscaldamento_attivo_cam_greta_kblue', 'sensor.trend_temperatura_camera_greta'],
            'climate.termostato_camera_matrimoniale': ['sensor.riscaldamento_attivo_letto_kblue', 'sensor.trend_temperatura_camera_matrimoniale'],
            'climate.termostato_wc': ['sensor.riscaldamento_attivo_wc_kblue', 'sensor.trend_temperatura_wc'],
            'climate.termostato_wc_letto': ['sensor.riscaldamento_attivo_wc_letto_kblue', 'sensor.trend_temperatura_wc_letto'],
            'climate.termostato_suite_letto': ['sensor.riscaldamento_attivo_letto_suite_kblue', 'sensor.trend_temperatura_suite_letto'],
            'climate.termostato_suite_salone': ['sensor.riscaldamento_attivo_salone_suite_kblue', 'sensor.trend_temperatura_suite_salone'],
            'climate.termostato_wc_suite': ['sensor.riscaldamento_attivo_wc_suite_kblue', 'sensor.trend_temperatura_wc_suite']
          } %}
          {% set held = states('input_text.zona_trattenuta').split('|')[0] %}
          {% set ns = namespace(v=false) %}
          {% if held != '' %}
            {% for c, v in m.items() if c != held %}
              {% set t = state_attr(c, 'current_temperature') | float(none) %}
              {% set sp = state_attr(c, 'temperature') | float(none) %}
              {% set cl = state_attr(v[1], 'classificazione') %}
              {% if states(c) not in ['off', 'unavailable', 'unknown'] %}
                {% if is_state(v[0], 'on') %}
                  {% set ns.v = true %}
                {% elif t is not none and t != 0 and sp is not none and t <= sp
                        and cl not in ['salita', 'salita_rapida'] %}
                  {% set ns.v = true %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.v }}

script:
  riscaldamento_notifica:
    alias: "Riscaldamento - notifica (iPhone + Telegram)"
    mode: queued
    fields:
      titolo:
        description: Titolo
      messaggio:
        description: Testo
    sequence:
      - action: notify.mobile_app_iphone_di_filippo
        data:
          title: "{{ titolo }}"
          message: "{{ messaggio }}"
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          title: "{{ titolo }}"
          message: "{{ messaggio }}"
          parse_mode: plain_text
