        to:
          - "on"
          - "off"
    sensor:
      - name: "Storico Camera matrimoniale"
        unique_id: storico_riscaldamento_camera_matrimoniale
        state: "{{ trigger.to_state.state }}"
        attributes:
          temperatura: "{{ state_attr('climate.termostato_camera_matrimoniale', 'current_temperature') }}"
          setpoint: "{{ state_attr('climate.termostato_camera_matrimoniale', 'temperature') }}"
          inizio: >-
