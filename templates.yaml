# ==============================================================================
# ALTRI SENSORI
# ==============================================================================


  - sensor:
      - name: "Display Stato Riscaldamento"
        unique_id: display_stato_riscaldamento
        state: >
          {% set ns = namespace(attivi=0) %}
          {% for sensor in states.sensor %}
            {% if 'riscaldamento_attivo_' in sensor.entity_id and sensor.state == 'on' %}
              {% set ns.attivi = ns.attivi + 1 %}
            {% endif %}
          {% endfor %}
          {% if ns.attivi > 0 %}
            Heating on in {{ ns.attivi }} zone{{ 's' if ns.attivi > 1 else '' }}
          {% else %}
            Heating Idle
          {% endif %}

# ==============================================================================
# TREND TEMPERATURA - Tutte le stanze
# Velocità di variazione della temperatura in °C/h, ricavata dai sensori
# statistics (change_second = °C/s) in sensors.yaml, moltiplicati per 3600.
# Per ogni stanza la catena è identica, con sorgente il sensore KBlue
# (indipendente dai climate):
#   sensore KBlue -> "Temperatura Attuale" -> "Stats" (sensors.yaml) -> "Trend"
# "Temperatura Attuale" è una copia filtrata: passa a unavailable quando il
# KBlue restituisce 0 (fallback del REST sensor), così lo 0 non entra nelle
# statistiche e non genera spike.
# Soglie classificazione: |v| > 0.5 °C/h = salita/discesa, |v| > 1.5 = rapida
# ==============================================================================

