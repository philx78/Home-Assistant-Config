# ==============================================================================
# SENSORI STATISTICI - Dashboard Consumi Elettrici
# Aggiunto: 10/01/2026
# ==============================================================================

  - sensor:

      # --- Potenza e bilanciamento fasi ---

      - name: "Potenza Totale Calcolata"
        unique_id: potenza_totale_calcolata_kblue
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set l1 = states('sensor.consumo_l1') | float(0) %}
          {% set l2 = states('sensor.consumo_l2') | float(0) %}
          {% set l3 = states('sensor.consumo_l3') | float(0) %}
          {{ (l1 + l2 + l3) | round(2) }}

      - name: "Bilanciamento Fasi"
        unique_id: bilanciamento_fasi_kblue
        unit_of_measurement: "%"
        state: >
          {% set l1 = states('sensor.consumo_l1') | float(0) %}
          {% set l2 = states('sensor.consumo_l2') | float(0) %}
          {% set l3 = states('sensor.consumo_l3') | float(0) %}
          {% set fasi = [l1, l2, l3] %}
          {% set max_fase = fasi | max %}
          {% set min_fase = fasi | min %}
          {% set tot = l1 + l2 + l3 %}
          {% if tot > 0.1 %}
            {{ (((max_fase - min_fase) / (tot / 3)) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        attributes:
          stato: >
            {% set bil = states('sensor.bilanciamento_fasi') | float(0) %}
            {% if bil < 20 %}
              Ottimo
            {% elif bil < 40 %}
              Buono
            {% elif bil < 60 %}
              Accettabile
            {% else %}
              Sbilanciato
            {% endif %}
          l1_percentuale: >
            {% set l1 = states('sensor.consumo_l1') | float(0) %}
            {% set tot = states('sensor.consumo_totale') | float(0.01) %}
            {{ ((l1 / tot) * 100) | round(1) }}
          l2_percentuale: >
            {% set l2 = states('sensor.consumo_l2') | float(0) %}
            {% set tot = states('sensor.consumo_totale') | float(0.01) %}
            {{ ((l2 / tot) * 100) | round(1) }}
          l3_percentuale: >
            {% set l3 = states('sensor.consumo_l3') | float(0) %}
            {% set tot = states('sensor.consumo_totale') | float(0.01) %}
            {{ ((l3 / tot) * 100) | round(1) }}

      - name: "Fase Più Carica"
        unique_id: fase_piu_carica_kblue
        state: >
          {% set l1 = states('sensor.consumo_l1') | float(0) %}
          {% set l2 = states('sensor.consumo_l2') | float(0) %}
          {% set l3 = states('sensor.consumo_l3') | float(0) %}
          {% set fasi = {'L1': l1, 'L2': l2, 'L3': l3} %}
          {{ fasi | dictsort(by='value') | last | first }}
        attributes:
          valore: >
            {% set l1 = states('sensor.consumo_l1') | float(0) %}
            {% set l2 = states('sensor.consumo_l2') | float(0) %}
            {% set l3 = states('sensor.consumo_l3') | float(0) %}
            {{ [l1, l2, l3] | max | round(2) }}

      # --- Costi e proiezioni (tariffa: input_number.tariffa_energia, editabile da dashboard) ---

      - name: "Costo Energia Oggi"
        unique_id: costo_energia_oggi_kblue
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('sensor.energia_giornaliera_totale') | float(0) %}
          {% set tariffa = states('input_number.tariffa_energia') | float(0.1488) %}
          {{ (kwh * tariffa) | round(2) }}

      - name: "Costo Energia Mese"
        unique_id: costo_energia_mese_kblue
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('sensor.energia_mensile_totale') | float(0) %}
          {% set tariffa = states('input_number.tariffa_energia') | float(0.1488) %}
          {{ (kwh * tariffa) | round(2) }}

      - name: "Proiezione Consumo Mensile"
        unique_id: proiezione_consumo_mensile_kblue
        unit_of_measurement: "kWh"
        state: >
          {% set oggi = now().day %}
          {% set tot_giorni = (now().replace(day=1) + timedelta(days=32)).replace(day=1) - timedelta(days=1) %}
          {% set tot_giorni = tot_giorni.day %}
          {% set consumo_attuale = states('sensor.energia_mensile_totale') | float(0) %}
          {% if oggi > 0 %}
            {{ ((consumo_attuale / oggi) * tot_giorni) | round(0) }}
          {% else %}
            0
          {% endif %}
        attributes:
          media_giornaliera: >
            {% set oggi = now().day %}
            {% set consumo = states('sensor.energia_mensile_totale') | float(0) %}
            {{ (consumo / oggi) | round(2) if oggi > 0 else 0 }}

      # --- Utilizzo contratto (max 9.9kW = 3x3.3kW per fase) ---

      - name: "Utilizzo Contratto"
        unique_id: utilizzo_contratto_percentuale
        unit_of_measurement: "%"
        state: >
          {% set tot = states('sensor.consumo_totale') | float(0) %}
          {% set max_contratto = 9.9 %}
          {{ ((tot / max_contratto) * 100) | round(1) }}
        attributes:
          stato: >
            {% set perc = states('sensor.utilizzo_contratto') | float(0) %}
            {% if perc < 50 %}
              Normale
            {% elif perc < 80 %}
              Attenzione
            {% elif perc < 95 %}
              Critico
            {% else %}
              Soglia Superata
            {% endif %}
          margine_disponibile: >
            {% set tot = states('sensor.consumo_totale') | float(0) %}
            {% set max_contratto = 9.9 %}
            {{ (max_contratto - tot) | round(2) }}

      # --- Allarmi per fase (soglie: attenzione 2.5kW / allerta 3.0kW / critico 3.3kW) ---

      - name: "Stato Allarme L1"
        unique_id: stato_allarme_l1
        state: >
          {% set consumo = states('sensor.consumo_l1') | float(0) %}
          {% if consumo >= 3.3 %}
            critico
          {% elif consumo >= 3.0 %}
            allerta
          {% elif consumo >= 2.5 %}
            attenzione
          {% else %}
            normale
          {% endif %}
        icon: >
          {% set consumo = states('sensor.consumo_l1') | float(0) %}
          {% if consumo >= 3.3 %}
            mdi:alert-circle
          {% elif consumo >= 3.0 %}
            mdi:alert
          {% elif consumo >= 2.5 %}
            mdi:alert-outline
          {% else %}
            mdi:check-circle
          {% endif %}
        attributes:
          percentuale_soglia: >
            {{ ((states('sensor.consumo_l1') | float(0) / 3.3) * 100) | round(1) }}

      - name: "Stato Allarme L2"
        unique_id: stato_allarme_l2
        state: >
          {% set consumo = states('sensor.consumo_l2') | float(0) %}
          {% if consumo >= 3.3 %}
            critico
          {% elif consumo >= 3.0 %}
            allerta
          {% elif consumo >= 2.5 %}
            attenzione
          {% else %}
            normale
          {% endif %}
        icon: >
          {% set consumo = states('sensor.consumo_l2') | float(0) %}
          {% if consumo >= 3.3 %}
            mdi:alert-circle
          {% elif consumo >= 3.0 %}
            mdi:alert
          {% elif consumo >= 2.5 %}
            mdi:alert-outline
          {% else %}
            mdi:check-circle
          {% endif %}
        attributes:
          percentuale_soglia: >
            {{ ((states('sensor.consumo_l2') | float(0) / 3.3) * 100) | round(1) }}

      - name: "Stato Allarme L3"
        unique_id: stato_allarme_l3
        state: >
          {% set consumo = states('sensor.consumo_l3') | float(0) %}
          {% if consumo >= 3.3 %}
            critico
          {% elif consumo >= 3.0 %}
            allerta
          {% elif consumo >= 2.5 %}
            attenzione
          {% else %}
            normale
          {% endif %}
        icon: >
          {% set consumo = states('sensor.consumo_l3') | float(0) %}
          {% if consumo >= 3.3 %}
            mdi:alert-circle
          {% elif consumo >= 3.0 %}
            mdi:alert
          {% elif consumo >= 2.5 %}
            mdi:alert-outline
          {% else %}
            mdi:check-circle
          {% endif %}
        attributes:
          percentuale_soglia: >
            {{ ((states('sensor.consumo_l3') | float(0) / 3.3) * 100) | round(1) }}

      # --- Allarme consumo totale (soglie: attenzione 7.0kW / allerta 8.5kW / critico 10.0kW) ---

      - name: "Stato Allarme Consumo Totale"
        unique_id: stato_allarme_consumo_totale
        state: >
          {% set consumo = states('sensor.consumo_totale') | float(0) %}
          {% if consumo >= 10.0 %}
            critico
          {% elif consumo >= 8.5 %}
            allerta
          {% elif consumo >= 7.0 %}
            attenzione
          {% else %}
            normale
          {% endif %}
        icon: >
          {% set consumo = states('sensor.consumo_totale') | float(0) %}
          {% if consumo >= 10.0 %}
            mdi:alert-octagon
          {% elif consumo >= 8.5 %}
            mdi:alert-circle
          {% elif consumo >= 7.0 %}
            mdi:alert
          {% else %}
            mdi:check-circle-outline
          {% endif %}
        attributes:
          percentuale_contratto: >
            {{ ((states('sensor.consumo_totale') | float(0) / 10.0) * 100) | round(1) }}
          fasi_in_allerta: >
            {% set fasi = namespace(count=0) %}
            {% if states('sensor.consumo_l1') | float(0) >= 3.0 %}
              {% set fasi.count = fasi.count + 1 %}
            {% endif %}
            {% if states('sensor.consumo_l2') | float(0) >= 3.0 %}
              {% set fasi.count = fasi.count + 1 %}
            {% endif %}
            {% if states('sensor.consumo_l3') | float(0) >= 3.0 %}
              {% set fasi.count = fasi.count + 1 %}
            {% endif %}
            {{ fasi.count }}

      - name: "Ultimo Allarme Consumo"
        unique_id: ultimo_allarme_consumo
        state: >
          {% set last_changed = states.sensor.consumo_totale.last_changed %}
          {% set now_time = now() %}
          {% set diff = (now_time - last_changed).total_seconds() %}
          {% if diff < 60 %}
            {{ diff | int }} secondi fa
          {% elif diff < 3600 %}
            {{ (diff / 60) | int }} minuti fa
          {% else %}
            {{ (diff / 3600) | int }} ore fa
          {% endif %}
        icon: mdi:clock-alert-outline

      - name: "Margine Fase Critica"
        unique_id: margine_fase_critica
        unit_of_measurement: "kW"
        state: >
          {% set l1 = states('sensor.consumo_l1') | float(0) %}
          {% set l2 = states('sensor.consumo_l2') | float(0) %}
          {% set l3 = states('sensor.consumo_l3') | float(0) %}
          {% set max_fase = [l1, l2, l3] | max %}
          {{ (3.3 - max_fase) | round(2) }}
        attributes:
          fase: >
            {% set l1 = states('sensor.consumo_l1') | float(0) %}
            {% set l2 = states('sensor.consumo_l2') | float(0) %}
            {% set l3 = states('sensor.consumo_l3') | float(0) %}
            {% set fasi = {'L1': l1, 'L2': l2, 'L3': l3} %}
            {{ fasi | dictsort(by='value') | last | first }}
          percentuale_utilizzo: >
            {% set l1 = states('sensor.consumo_l1') | float(0) %}
            {% set l2 = states('sensor.consumo_l2') | float(0) %}
            {% set l3 = states('sensor.consumo_l3') | float(0) %}
            {% set max_fase = [l1, l2, l3] | max %}
            {{ ((max_fase / 3.3) * 100) | round(1) }}
# ==============================================================================
# ALLARME RISCO - Stato per partizione + riepilogo (per widget iOS)
