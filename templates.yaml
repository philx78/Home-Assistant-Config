# ==============================================================================
# templates.yaml
# Configurazione template entities per Home Assistant
# Luci, Cover, Switch e Sensori KBlue + Sensibo
# ==============================================================================


# ==============================================================================
# SENSORI TEMPERATURA E UMIDITÀ - Sensibo
# ==============================================================================

  - sensor:
      - name: "Temperatura salone"
        unique_id: temperatura_umidita_salone
        unit_of_measurement: "°C"
        state: "{{ state_attr('climate.cdz_salone', 'current_temperature') | round(1) }}"
      - name: "Umidità salone"
        unit_of_measurement: "%"
        state: "{{ state_attr('climate.cdz_salone', 'current_humidity') }}"

  - sensor:
      - name: "Temperatura camera matrimoniale"
        unique_id: temperatura_umidita_camera_matrimoniale
        unit_of_measurement: "°C"
        state: "{{ state_attr('climate.camera_matrimoniale', 'current_temperature') | round(1) }}"
      - name: "Umidità camera matrimoniale"
        unit_of_measurement: "%"
        state: "{{ state_attr('climate.camera_matrimoniale', 'current_humidity') }}"

  - sensor:
      - name: "Temperatura cucina"
        unique_id: temperatura_umidita_cucina
        unit_of_measurement: "°C"
        state: "{{ state_attr('climate.cucina', 'current_temperature') | round(1) }}"
      - name: "Umidità cucina"
        unit_of_measurement: "%"
        state: "{{ state_attr('climate.cucina', 'current_humidity') }}"

  - sensor:
      - name: "Temperatura camera di Francesco"
        unique_id: temperatura_umidita_francesco
        unit_of_measurement: "°C"
        state: "{{ state_attr('climate.cdz_camera_di_francesco', 'current_temperature') | round(1) }}"
      - name: "Umidità camera di Francesco"
        unit_of_measurement: "%"
        state: "{{ state_attr('climate.cdz_camera_di_francesco', 'current_humidity') }}"

  - sensor:
      - name: "Temperatura camera di Greta"
        unique_id: temperatura_umidita_greta
        unit_of_measurement: "°C"
        state: "{{ state_attr('climate.cdz_camera_di_greta', 'current_temperature') | round(1) }}"
      - name: "Umidità camera di Greta"
