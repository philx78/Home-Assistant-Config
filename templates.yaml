          {% set s = states('alarm_control_panel.risco_casetta_partition_0') %}
          {{ 'mdi:shield-off' if s == 'disarmed' else ('mdi:shield-alert' if s == 'triggered' else 'mdi:shield-lock') }}

      - name: "Stato Allarme Comune"
        unique_id: stato_allarme_risco_comune
        state: >
          {% set s = states('alarm_control_panel.risco_casetta_partition_1') %}
          {{ {'disarmed':'Disinserito','armed_away':'Inserito (assente)',
              'armed_home':'Inserito (presente)','armed_night':'Inserito (notte)',
              'arming':'Inserimento in corso','pending':'Ritardo ingresso',
              'triggered':'ALLARME'}.get(s, s) }}
        icon: >
          {% set s = states('alarm_control_panel.risco_casetta_partition_1') %}
          {{ 'mdi:shield-off' if s == 'disarmed' else ('mdi:shield-alert' if s == 'triggered' else 'mdi:shield-lock') }}

      - name: "Stato Allarme Casa Mirella"
        unique_id: stato_allarme_risco_casa_mirella
        state: >
          {% set s = states('alarm_control_panel.risco_casetta_partition_2') %}
          {{ {'disarmed':'Disinserito','armed_away':'Inserito (assente)',
              'armed_home':'Inserito (presente)','armed_night':'Inserito (notte)',
              'arming':'Inserimento in corso','pending':'Ritardo ingresso',
              'triggered':'ALLARME'}.get(s, s) }}
        icon: >
          {% set s = states('alarm_control_panel.risco_casetta_partition_2') %}
          {{ 'mdi:shield-off' if s == 'disarmed' else ('mdi:shield-alert' if s == 'triggered' else 'mdi:shield-lock') }}

      - name: "Stato Allarme Riepilogo"
        unique_id: stato_allarme_risco_riepilogo
        state: >
          {% set p = [states('alarm_control_panel.risco_casetta_partition_0'),
                      states('alarm_control_panel.risco_casetta_partition_1'),
                      states('alarm_control_panel.risco_casetta_partition_2')] %}
          {% set dis = p | select('eq', 'disarmed') | list | count %}
          {% if 'triggered' in p %}ALLARME
          {% elif 'arming' in p or 'pending' in p %}In transizione
          {% elif dis == 3 %}Tutto disinserito
          {% elif dis == 0 %}Tutto inserito
          {% else %}Parziale
          {% endif %}
        icon: >
          {% set p = [states('alarm_control_panel.risco_casetta_partition_0'),
                      states('alarm_control_panel.risco_casetta_partition_1'),
                      states('alarm_control_panel.risco_casetta_partition_2')] %}
          {% set dis = p | select('eq', 'disarmed') | list | count %}
          {{ 'mdi:shield-alert' if 'triggered' in p else ('mdi:shield-off' if dis == 3 else 'mdi:shield-lock') }}

  # ==============================================================================
  # RISCALDAMENTO - Log eventi + min/max esterna (per report serale)
  # ==============================================================================

  - trigger:
      - platform: state
        entity_id:
          - binary_sensor.riscaldamento_in_funzione
          - sensor.riscaldamento_attivo_salone_kblue
          - sensor.riscaldamento_attivo_cucina_kblue
          - sensor.riscaldamento_attivo_camera_francesco
          - sensor.riscaldamento_attivo_cam_greta_kblue
          - sensor.riscaldamento_attivo_letto_kblue
          - sensor.riscaldamento_attivo_wc_kblue
          - sensor.riscaldamento_attivo_wc_letto_kblue
          - sensor.riscaldamento_attivo_salone_suite_kblue
          - sensor.riscaldamento_attivo_letto_suite_kblue
          - sensor.riscaldamento_attivo_wc_suite_kblue
      - platform: time
        at: "00:00:00"
    condition:
      - condition: template
        value_template: >
          {{ trigger.platform == 'time'
             or (trigger.from_state is not none
                 and trigger.from_state.state in ['on', 'off']
                 and trigger.to_state.state in ['on', 'off']) }}
    sensor:
      - name: Riscaldamento log eventi
        unique_id: riscaldamento_log_eventi
        state: "{{ now().isoformat() }}"
        attributes:
          eventi: >
            {% set nomi = {
              'salone_kblue': 'Soggiorno',
              'cucina_kblue': 'Cucina',
              'camera_francesco': 'Camera Francesco',
              'cam_greta_kblue': 'Camera Greta',
              'letto_kblue': 'Camera Matrimoniale',
              'wc_kblue': 'Bagno',
              'wc_letto_kblue': 'Bagno privato',
              'salone_suite_kblue': 'Suite Soggiorno',
              'letto_suite_kblue': 'Suite Camera',
              'wc_suite_kblue': 'Suite Bagno'
            } %}
            {% set ext = states('sensor.stazione_meteo_modulo_meteo_esterno_temperature') %}
            {% if trigger.platform == 'time' %}
              {% set ns = namespace(r=[]) %}
              {% if is_state('binary_sensor.riscaldamento_in_funzione', 'on') %}
                {% set ns.r = ns.r + [{'ora': '00:00', 'zona': 'IMPIANTO',
                  'stato': 'on', 'esterna': ext, 'nota': 'già acceso a mezzanotte'}] %}
              {% endif %}
              {% for s in states.sensor
                 if 'riscaldamento_attivo_' in s.entity_id and s.state == 'on' %}
                {% set k = s.entity_id.split('riscaldamento_attivo_')[1] %}
                {% set ns.r = ns.r + [{'ora': '00:00', 'zona': nomi.get(k, k),
                  'stato': 'on', 'esterna': ext, 'nota': 'già accesa a mezzanotte'}] %}
              {% endfor %}
              {{ ns.r }}
            {% else %}
              {% set old = this.attributes.eventi | default([], true) %}
              {% set e = trigger.entity_id %}
              {% set zona = 'IMPIANTO' if e == 'binary_sensor.riscaldamento_in_funzione'
                 else nomi.get(e.split('riscaldamento_attivo_')[1], e) %}
              {% set ev = {'ora': now().strftime('%H:%M'), 'zona': zona,
                 'stato': trigger.to_state.state, 'esterna': ext} %}
              {{ (old + [ev])[-120:] }}
            {% endif %}

  - trigger:
      - platform: state
        entity_id: sensor.stazione_meteo_modulo_meteo_esterno_temperature
      - platform: time
        at: "00:00:00"
      - platform: homeassistant
        event: start
    sensor:
      - name: Esterna minima oggi
        unique_id: esterna_minima_oggi
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set ext = states('sensor.stazione_meteo_modulo_meteo_esterno_temperature') | float(none) %}
          {% set old = this.state | float(none) %}
          {% if ext is none %}{{ old }}
          {% elif trigger.platform == 'time' or old is none %}{{ ext }}
          {% else %}{{ [old, ext] | min }}{% endif %}
      - name: Esterna massima oggi
        unique_id: esterna_massima_oggi
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set ext = states('sensor.stazione_meteo_modulo_meteo_esterno_temperature') | float(none) %}
          {% set old = this.state | float(none) %}
          {% if ext is none %}{{ old }}
          {% elif trigger.platform == 'time' or old is none %}{{ ext }}
          {% else %}{{ [old, ext] | max }}{% endif %}

  # ==============================================================================
  # POMPA DI CALORE ELCO - Stima della potenza (per report serale)
  # Potenza stimata = 3 x la fase meno carica (kW). Le utenze di casa si
  # distribuiscono sulle tre fasi, la pompa e' trifase e le carica in modo uguale:
  # il minimo delle tre isola (circa) la quota della pompa.
  # E' una stima, tendenzialmente per eccesso: nel minimo e' inclusa anche la
  # fase con meno altri carichi, contata tre volte.
  # Vale 0 se la pompa risulta esplicitamente spenta (se Remocon-Net e' non
  # disponibile la stima conta comunque).
  # L'energia si ricava da UI: helper Integrale (Riemann) su questo sensore +
  # Contatore di utilita' giornaliero "Pompa Elco energia stimata oggi".
  # ==============================================================================

  - sensor:
      - name: Pompa Elco potenza stimata
        unique_id: pompa_elco_potenza_stimata
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.consumo_l1') | is_number
             and states('sensor.consumo_l2') | is_number
             and states('sensor.consumo_l3') | is_number }}
        state: >
          {% if is_state('binary_sensor.remocon_net_heat_pump_running', 'off') %}
            0
          {% else %}
            {{ (3 * ([states('sensor.consumo_l1') | float(0),
                      states('sensor.consumo_l2') | float(0),
                      states('sensor.consumo_l3') | float(0)] | min)) | round(3) }}
          {% endif %}

# ==============================================================================
# SENSORI "STABILI" KBlue - ignorano zeri e letture non valide
# Il KBlue ogni tanto risponde con valori a 0 oppure la chiamata REST fallisce
# (sensori unavailable): in quel caso questi sensori mantengono l'ultimo valore
# buono, cosi' target, modalita' e stato dei climate non saltano a 0 / Off.
# Sono sensori con trigger (aggiornati a ogni cambio dei sensori grezzi e comunque
# una volta al minuto): this.state e' l'ultimo valore buono, e viene ripristinato
# anche dopo un riavvio. I climate (climate.yaml) leggono da qui.
# Se non c'e' ancora nessun valore buono (primo avvio, nessun dato valido) lo stato e'
# 'unknown' invece di 0 / off: niente zeri finti nei grafici e nelle statistiche, e i
# climate usano il sensore grezzo (has_value) finche' il sensore stabile non si valorizza.
