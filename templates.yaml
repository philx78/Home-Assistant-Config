  # Sensori di bypass allarme Risco: diventa "on" se almeno uno switch
  # con "_bypassed" nell'entity_id è attivo. Usato per mostrare la card
  # "Sensori in bypass" nella dashboard Security.

  - binary_sensor:
    - name: Sensori in bypass
      unique_id: sensori_in_bypass
      icon: mdi:shield-alert
      state: >-
        {{ states.switch
           | selectattr('entity_id', 'search', '_bypassed')
           | selectattr('state', 'eq', 'on')
           | list | count > 0 }}


  # Visibilità card clima in dashboard
  # La card della stagione corrente è sempre visibile (anche con impianto spento).
  # La card dell'altra stagione compare solo se c'è qualcosa di acceso.
  # La stagione è definita in un solo punto: "Stagione estiva".

  - binary_sensor:

    # ON da aprile a settembre (stagione climatizzatori), OFF da ottobre a marzo
    # (stagione riscaldamento). Per spostare i confini modifica solo la lista dei mesi.
    # Usato da: condizioni di visibilità delle card riscaldamento e CDZ.
    - name: "Stagione estiva"
      unique_id: stagione_estiva
      state: "{{ now().month in [4, 5, 6, 7, 8, 9] }}"

    # ON se almeno una zona ha il riscaldamento in funzione.
    # Le zone sono riconosciute in automatico: basta che il sensore si chiami
    # sensor.riscaldamento_attivo_<zona>, quindi una zona nuova non richiede modifiche qui.
    # Usato da: card "Riscaldamento" (visibilità fuori stagione, colore e titolo).
    - name: "Riscaldamento in funzione"
      unique_id: riscaldamento_in_funzione
      state: >
        {{ states.sensor
           | selectattr('entity_id', 'search', 'riscaldamento_attivo_')
           | selectattr('state', 'eq', 'on')
           | list | count > 0 }}

    # ON se almeno un climatizzatore (CDZ) è acceso, in qualunque modalità
    # (cool, heat, auto, dry, fan_only...). Gli stati off, unavailable e unknown
    # NON contano come acceso.
    # L'elenco dei climate è manuale: se aggiungi un CDZ va inserito qui
    # e anche nella card CDZ della dashboard.
    # Usato da: card "Climatizzatori" (visibilità fuori stagione, colore).
    - name: "CDZ accesi"
      unique_id: cdz_accesi
      state: >
        {% set cdz = [
          states('climate.cdz_salone'),
          states('climate.cucina'),
          states('climate.cdz_camera_di_francesco'),
          states('climate.cdz_camera_di_greta'),
          states('climate.camera_matrimoniale')
        ] %}
        {{ cdz | reject('in', ['off', 'unavailable', 'unknown']) | list | count > 0 }}

    # Finestra WC: replica lo stato del contatto (on/off) aggiungendo
    # la temperatura del termostato WC come attributo, per mostrarla
    # nella chronicle-card alla apertura/chiusura della finestra.
    - name: "Storico finestra WC"
      unique_id: storico_finestra_wc
      state: "{{ states('binary_sensor.sensore_dw_wc_contact') }}"
      attributes:
        temperatura: >
          {{ state_attr('climate.termostato_wc', 'current_temperature') | round(1) }}
      availability: "{{ not is_state('binary_sensor.sensore_dw_wc_contact', 'unavailable') }}"

# ==============================================================================
# LUCI KBLUE - Zona Giorno (Salotto)
# ==============================================================================

  - light:
    - unique_id: strip_salotto_kblue
      name: "Strip Salotto (KBlue)"
      state: >
        {% set s = states('sensor.stato_strip_salotto_kblue') %}
        {{ 'off' if s in ['unavailable', 'unknown', 'none'] else s }}
      turn_on:
        - action: rest_command.kblue_strip_salotto_on
      turn_off:
        - action: rest_command.kblue_strip_salotto_off
      set_level:
        - action: rest_command.kblue_strip_salotto_brightness
          data:
            brightness: "{{ brightness }}"
      level: "{{ states('sensor.brightness_strip_salotto_kblue') | int(0) }}"

