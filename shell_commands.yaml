# Comando termostati KBlue (parametrico, usato da script.kblue_termostato_comando)
#   azione = <temperatura> | auto | on | off     ixv = flag manuale (auto) / on-off (on, off)
kblue_termostato: 'flock /tmp/kblue_write.lock /config/scripts/kblue_set_setpoint.sh "{{ ixogm }}" "{{ azione }}" "{{ ixv }}"'
kblue_login: 'flock /tmp/kblue_write.lock /config/scripts/kblue_login.sh'
backup_config: "/config/scripts/backup_config.sh"
rainviewer_check: >
  python3 /config/scripts/rainviewer_alert.py
