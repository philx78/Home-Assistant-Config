- id: '1759174306440'
  alias: UPS - Notifica mancanza corrente
  description: Notifica quando l'UPS va in batteria, ogni 5 min se persiste, e quando
    torna la corrente
  triggers:
  - id: perso
    entity_id:
    - sensor.back_ups_status
    to:
    - On Battery
    - Battery Discharging
    trigger: state
  - id: ripeti
    trigger: time_pattern
    minutes: /5
  - id: tornata
    entity_id:
    - sensor.back_ups_status
    from:
    - On Battery
    - Battery Discharging
    to: Online
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: perso
      sequence:
      - data:
          title: ⚡ Mancanza di corrente
          message: L'UPS è passato a batteria!
        action: notify.mobile_app_iphone_di_filippo
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          message: '⚡ *Mancanza di corrente*

            L''UPS è passato a batteria!

            '
    - conditions:
      - condition: trigger
        id: ripeti
      - condition: state
        entity_id: sensor.back_ups_status
        state:
        - On Battery
        - Battery Discharging
      sequence:
      - data:
          title: ⚡ Corrente ancora assente
          message: L'UPS è ancora a batteria da un po'.
        action: notify.mobile_app_iphone_di_filippo
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          message: '⚡ *Corrente ancora assente*

            L''UPS è ancora a batteria da un po''.

            '
    - conditions:
      - condition: trigger
        id: tornata
      sequence:
      - data:
          title: ✅ Corrente ripristinata
          message: La corrente è tornata, UPS torna online.
        action: notify.mobile_app_iphone_di_filippo
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          message: ✅  *Corrente ripristinata* La corrente è tornata, UPS ONLINE.
  mode: single
