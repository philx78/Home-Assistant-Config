    entity_id: input_boolean.presence
    state:
    - 'on'
    enabled: false
  - condition: and
    conditions:
    - condition: state
      entity_id: person.filippo_durzu
      state:
      - not_home
    - condition: state
      entity_id: person.chiara
      state:
      - not_home
    - condition: state
      entity_id: person.greta
      state:
      - not_home
    - condition: state
      entity_id: person.mirella
      state:
      - not_home
  actions:
  - action: script.inserisci_allarme
    metadata: {}
    data: {}
  - action: notify.mobile_app_iphone_di_filippo
    metadata: {}
    data:
      message: L’allarme è stato inserito automaticamente (modalità viaggio)
  mode: single
