- id: '1787678465297'
  alias: AWTRIX - App custom stato allarme
  description: Aggiorna l'app allarme su AWTRIX ogni volta che cambia lo stato
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.risco_casetta_partition_1
  actions:
  - action: mqtt.publish
    data:
      topic: awtrix_3e5e6c/custom/allarme
      evaluate_payload: true
      payload: "{% set stato = trigger.to_state.state %} {% set mappa = {\n  'disarmed':
        \     {'testo': 'DISARMATO',   'icona': '1961', 'colore': '#00FF00', 'ripeti':
        1},\n  'armed_home':    {'testo': 'ARMATO CASA',  'icona': '1961', 'colore':
        '#FFA500', 'ripeti': 1},\n  'armed_away':    {'testo': 'ARMATO',       'icona':
        '1961', 'colore': '#FF0000', 'ripeti': 1},\n  'armed_night':   {'testo': 'ARMATO
        NOTTE', 'icona': '1961', 'colore': '#FF8C00', 'ripeti': 1},\n  'armed_vacation':{'testo':
        'ARMATO VAC.',  'icona': '1961', 'colore': '#FF0000', 'ripeti': 1},\n  'pending':
        \      {'testo': 'IN ATTESA',    'icona': '1961', 'colore': '#FFFF00', 'ripeti':
        1},\n  'arming':        {'testo': 'ARMANDO...',   'icona': '1961', 'colore':
        '#FFFF00', 'ripeti': 1},\n  'disarming':     {'testo': 'DISARMANDO...','icona':
        '1961', 'colore': '#FFFF00', 'ripeti': 1},\n  'triggered':     {'testo': 'ALLARME!',
        \    'icona': '1961', 'colore': '#FF0000', 'ripeti': 10}\n} %} {% set d =
        mappa.get(stato, {'testo': stato | upper, 'icona': '1961', 'colore': '#FFFFFF',
        'ripeti': 1}) %} {{ {\"text\": d.testo, \"icon\": d.icona, \"color\": d.colore,
        \"duration\": 6, \"repeat\": d.ripeti, \"pushIcon\": 1 if stato == 'triggered'
        else 0} | tojson }}"
  mode: single
