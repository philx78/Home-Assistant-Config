  description: 'Quando presence va OFF, se l''allarme non è già inserito, avvia il
    timer timer.alarm_grace_period_timer (10 minuti) e manda una notifica Telegram
    con i pulsanti "Annulla armo" e "Arma ora". L''inserimento viene annullato se
    si preme Annulla, se si annulla il timer dalla dashboard o se torna presenza.
    "Arma ora" salta l''attesa e i controlli. Allo scadere del timer controlla anche
    i sensori IR e mmWave: se rileva attività negli ultimi 10 minuti (ospiti, pulizie)
    non arma, ma chiede via Telegram se armare comunque o mettere in pausa l''armo
    automatico (script.pausa_armo_automatico, 1 h o 3 h; senza risposta in 5 minuti
    pausa di 1 h). Se invece la casa risulta vuota arma: se una o entrambe le porte
    interne sono aperte, bypassa i relativi sensori, inserisce l''allarme e notifica
    con riserva.

    '
  triggers:
  - trigger: state
    entity_id: input_boolean.presence
    to: 'off'
  conditions:
  - condition: state
    entity_id: alarm_control_panel.risco_casetta_partition_1
    state: disarmed
  actions:
  - action: timer.start
    target:
      entity_id: timer.alarm_grace_period_timer
    data:
      duration: 600
  - action: telegram_bot.send_message
    data:
      entity_id:
      - notify.homeassistant_filippo_8511463273
      message: Nessuna presenza rilevata in casa, entro 10 minuti si attiverà il sistema
        anti-intrusione
      inline_keyboard:
      - ❌ Annulla armo:/annulla_armo, ⏩ Arma ora:/arma_ora
    response_variable: msg_grace
  - wait_for_trigger:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.alarm_grace_period_timer
      id: scaduto
    - trigger: event
      event_type: timer.cancelled
      event_data:
        entity_id: timer.alarm_grace_period_timer
      id: annulla
    - trigger: event
      event_type: telegram_callback
      event_data:
        data: /annulla_armo
        chat_id: 8511463273
      id: annulla
    - trigger: event
      event_type: telegram_callback
      event_data:
        data: /arma_ora
        chat_id: 8511463273
      id: arma_ora
    - trigger: state
      entity_id: input_boolean.presence
      to: 'on'
      id: rientro
    timeout:
      minutes: 11
    continue_on_timeout: true
  - variables:
      esito: '{{ wait.trigger.id if wait.trigger is not none else ''timeout'' }}'
  - action: timer.cancel
    target:
      entity_id: timer.alarm_grace_period_timer
  - action: telegram_bot.edit_replymarkup
    continue_on_error: true
    data:
      chat_id: '{{ msg_grace.chats[0].chat_id }}'
      message_id: '{{ msg_grace.chats[0].message_id }}'
      inline_keyboard: []
  - if:
    - condition: template
      value_template: '{{ wait.trigger is not none and wait.trigger.platform == ''event''
        and wait.trigger.event.event_type == ''telegram_callback'' }}'
    then:
    - action: telegram_bot.answer_callback_query
      continue_on_error: true
      data:
        callback_query_id: '{{ wait.trigger.event.data.id }}'
        message: '{{ ''Inserimento annullato'' if esito == ''annulla'' else ''Inserimento
          in corso'' }}'
  - variables:
      finestra_attivita_s: 600
      sensori_attivita:
        binary_sensor.esp32_s3_box_3_presence_detect: Camera matrimoniale (mmWave)
        binary_sensor.s3_box_bedroom_presence_detect: Cucina (mmWave)
        binary_sensor.presenza_salone_presence: Salone (mmWave)
        binary_sensor.presenza_cabina_armadio_presence: Cabina armadio (mmWave)
        binary_sensor.sensore_presenza_armadio_occupancy: Armadio (mmWave)
        binary_sensor.ir_corr_filippo: Corridoio (IR)
        binary_sensor.ir_mirella: Suite (IR)
        binary_sensor.ir_ingresso: Ingresso (IR)
        binary_sensor.ir_sal_filippo: Salone (IR)
  - variables:
      attivita: "{% set ns = namespace(l=[]) %} {% for e, n in sensori_attivita.items()
        %}\n  {% set s = states[e] %}\n  {% if s is not none and (s.state == 'on'
        or (s.state not in ['unavailable', 'unknown'] and (now() - s.last_changed).total_seconds()
        < finestra_attivita_s)) %}\n    {% set ns.l = ns.l + [n] %}\n  {% endif %}\n{%
        endfor %} {{ ns.l | join(', ') }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ esito == ''annulla'' }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          entity_id:
          - notify.homeassistant_filippo_8511463273
          message: "\U0001F6D1 Inserimento allarme annullato manualmente."
    - conditions:
      - condition: state
        entity_id: input_boolean.presence
        state: 'on'
      sequence:
      - action: telegram_bot.send_message
        data:
          entity_id:
          - notify.homeassistant_filippo_8511463273
          message: '✅ Presenza rilevata durante il grace-period: inserimento allarme
            annullato.'
    - conditions:
      - condition: state
        entity_id: input_boolean.presence
        state: 'off'
      - condition: state
        entity_id: alarm_control_panel.risco_casetta_partition_1
        state: disarmed
      - condition: template
        value_template: '{{ esito in [''scaduto'', ''timeout''] and attivita | length
          > 0 }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          entity_id:
          - notify.homeassistant_filippo_8511463273
          message: "\U0001F6B6 Nessun tracker in casa, ma i sensori rilevano attività:
            {{ attivita }}. Probabilmente c'è qualcuno (ospiti, pulizie). Non armo
            automaticamente: come procedo?"
          inline_keyboard:
          - ⏩ Arma comunque:/arma_comunque, ⏸️ Pausa 1 h:/pausa_armo_1h, ⏸️ Pausa
            3 h:/pausa_armo_3h
        response_variable: msg_attivita
      - wait_for_trigger:
        - trigger: event
          event_type: telegram_callback
          event_data:
            data: /arma_comunque
            chat_id: 8511463273
          id: arma_comunque
        - trigger: event
          event_type: telegram_callback
          event_data:
            data: /pausa_armo_1h
            chat_id: 8511463273
          id: pausa_1h
        - trigger: event
          event_type: telegram_callback
          event_data:
            data: /pausa_armo_3h
            chat_id: 8511463273
          id: pausa_3h
        - trigger: state
          entity_id: input_boolean.presence
          to: 'on'
          id: rientro
        timeout:
          minutes: 5
        continue_on_timeout: true
      - action: telegram_bot.edit_replymarkup
        continue_on_error: true
        data:
          chat_id: '{{ msg_attivita.chats[0].chat_id }}'
          message_id: '{{ msg_attivita.chats[0].message_id }}'
          inline_keyboard: []
      - if:
        - condition: template
          value_template: '{{ wait.trigger is not none and wait.trigger.platform ==
            ''event'' }}'
        then:
        - action: telegram_bot.answer_callback_query
          continue_on_error: true
          data:
            callback_query_id: '{{ wait.trigger.event.data.id }}'
            message: Ricevuto
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.id == ''rientro''
              }}'
          sequence:
          - action: telegram_bot.send_message
            data:
              entity_id:
              - notify.homeassistant_filippo_8511463273
              message: '✅ Presenza rilevata: inserimento allarme annullato.'
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.id == ''arma_comunque''
              }}'
          sequence:
          - variables:
              porta_mirella_aperta: '{{ states(''binary_sensor.porta_mirella'') ==
                ''on'' }}'
              porta_filippo_aperta: '{{ states(''binary_sensor.porta_filippo'') ==
                ''on'' }}'
          - if:
            - condition: template
              value_template: '{{ porta_mirella_aperta }}'
            then:
            - action: switch.turn_on
              target:
                entity_id: switch.porta_mirella_bypassed
          - if:
            - condition: template
              value_template: '{{ porta_filippo_aperta }}'
            then:
            - action: switch.turn_on
              target:
                entity_id: switch.porta_filippo_bypassed
          - action: alarm_control_panel.alarm_arm_away
            target:
              device_id:
              - b1801aea27f8c2682b8779dec10a12a9
              - df67f423d0dca29c15c6f8212f0bdb44
              - c903568bd46a79a3a35fa7b1b525f410
            data: {}
          - action: telegram_bot.send_message
            data:
              entity_id:
              - notify.homeassistant_filippo_8511463273
              message: ⚠️ Allarme inserito su tua conferma nonostante attività rilevata
                ({{ attivita }}).{% if porta_mirella_aperta %} Porta di Mirella bypassata.{%
                endif %}{% if porta_filippo_aperta %} Porta di Filippo bypassata.{%
                endif %}
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.id == ''pausa_3h''
              }}'
          sequence:
          - action: telegram_bot.send_message
            data:
              entity_id:
              - notify.homeassistant_filippo_8511463273
              message: ⏸️ Armo automatico in pausa per 3 ore.
          - action: script.pausa_armo_automatico
            data:
              ore: 3
        default:
        - action: telegram_bot.send_message
          data:
            entity_id:
            - notify.homeassistant_filippo_8511463273
            message: ⏸️ Armo automatico in pausa per 1 ora{% if wait.trigger is none
              %} (nessuna risposta){% endif %}.
        - action: script.pausa_armo_automatico
          data:
            ore: 1
    - conditions:
      - condition: state
        entity_id: input_boolean.presence
        state: 'off'
      - condition: state
        entity_id: alarm_control_panel.risco_casetta_partition_1
        state: disarmed
      sequence:
      - variables:
          porta_mirella_aperta: '{{ states(''binary_sensor.porta_mirella'') == ''on''
            }}'
          porta_filippo_aperta: '{{ states(''binary_sensor.porta_filippo'') == ''on''
            }}'
      - if:
        - condition: template
          value_template: '{{ porta_mirella_aperta }}'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.porta_mirella_bypassed
      - if:
        - condition: template
          value_template: '{{ porta_filippo_aperta }}'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.porta_filippo_bypassed
      - action: alarm_control_panel.alarm_arm_away
        target:
          device_id:
          - b1801aea27f8c2682b8779dec10a12a9
          - df67f423d0dca29c15c6f8212f0bdb44
          - c903568bd46a79a3a35fa7b1b525f410
        data: {}
      - action: telegram_bot.send_message
        data:
          entity_id:
          - notify.homeassistant_filippo_8511463273
          message: '{% if porta_mirella_aperta and porta_filippo_aperta %} ⚠️ Allarme
            inserito con RISERVA: porte di Mirella e Filippo erano aperte e sono state
            bypassate. {% elif porta_mirella_aperta %} ⚠️ Allarme inserito con RISERVA:
            porta di Mirella era aperta ed è stata bypassata. {% elif porta_filippo_aperta
            %} ⚠️ Allarme inserito con RISERVA: porta di Filippo era aperta ed è stata
            bypassata. {% else %} ✅ Allarme inserito correttamente. Tutte le porte
            interne erano chiuse. {% endif %}'
    default:
    - action: telegram_bot.send_message
      data:
        entity_id:
        - notify.homeassistant_filippo_8511463273
        message: 'ℹ️ Allarme già inserito manualmente durante il periodo di grace-period:
          nessuna azione necessaria.'
  mode: restart
