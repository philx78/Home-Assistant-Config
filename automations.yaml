- id: '1780492608216'
  alias: Presence - Gestione input_boolean.presence
  description: 'Aggiorna input_boolean.presence in base alle persone tracciate. ON
    = almeno una persona a casa, OFF = nessuno a casa.

    '
  triggers:
  - trigger: state
    entity_id:
    - person.filippo_durzu
    - person.chiara
    - person.greta
    - person.mirella
    - person.francesco
    to:
    - home
  - trigger: state
    entity_id:
    - person.filippo_durzu
    - person.chiara
    - person.greta
    - person.mirella
    - person.francesco
    to:
    - not_home
    for:
      minutes: 3
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ persone_a_casa > 0 }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.presence
    - conditions:
      - condition: template
        value_template: '{{ persone_a_casa == 0 }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.presence
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          message: "\U0001F3E0 Nessun tracker rilevato a casa"
          entity_id:
          - notify.homeassistant_filippo_8511463273
  mode: restart
  variables:
    persone_a_casa: "{{ ['person.filippo_durzu', 'person.chiara', 'person.greta',
      'person.mirella']\n   | select('is_state', 'home') | list | count }}\n"
