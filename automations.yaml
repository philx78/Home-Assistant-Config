  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - variables:
      numero_avvio: '{{ states(''counter.riavvii_home_assistant'') | int(0) + 1 }}'
  - action: counter.increment
    target:
      entity_id: counter.riavvii_home_assistant
