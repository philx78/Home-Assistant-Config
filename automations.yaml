- id: '1678901234567'
  alias: Rinnova sessione KBlue
  description: Fa login sul KBlue solo quando serve e non sovrascrive il cookie buono
    se il login fallisce (script kblue_login.sh). Il KBlue ha un limite di sessioni
    aperte (risposta lgn -3 con sessions 8), quindi un login ogni minuto le accumula.
    Parte all'avvio, una volta all'ora, quando il sensore "Stato Sessione (KBlue)"
    resta "ko" per 20 secondi e, finche' resta "ko", ritenta ogni 5 minuti. Nel frattempo
    i sensori mantengono l'ultimo valore letto.
  triggers:
  - trigger: homeassistant
    event: start
    id: avvio
  - trigger: state
    entity_id: sensor.stato_sessione_kblue
    to: ko
    for: 00:00:20
    id: ko
  - trigger: time_pattern
    minutes: /5
    id: ciclo
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id:
      - avvio
      - ko
    - condition: template
      value_template: '{{ is_state(''sensor.stato_sessione_kblue'', ''ko'') or now().minute
        < 5 }}'
  actions:
  - action: shell_command.kblue_login
    response_variable: esito
    continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ esito is defined and esito.returncode == 0 }}'
    then:
    - action: homeassistant.update_entity
      target:
        entity_id:
        - sensor.kblue_user_cookie
        - sensor.kblue_session_cookie
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.temperatura_salone_kblue
  - delay: 00:01:00
  mode: single
