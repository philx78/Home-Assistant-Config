- id: '1760473635407'
  alias: Avviso pioggia notturna (Met.no)
  description: Notifica alle 22 se è prevista pioggia tra mezzanotte e le 06:00
  triggers:
  - trigger: time
    at: '22:00:00'
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: hourly
    response_variable: previsioni
  - variables:
      lista: '{{ previsioni[''weather.forecast_home''].forecast }}'
      domani: '{{ (now() + timedelta(days=1)).date() }}'
      fascia: "{{ lista | selectattr('datetime', 'as_datetime') \n         | selectattr('datetime',
        '>', tomorrow_at('00:00')) \n         | selectattr('datetime', '<=', tomorrow_at('06:00'))
        \n         | list }}\n"
      pioggia: '{{ fascia | selectattr(''condition'', ''search'', ''rain'') | list
        }}

        '
      mm_totali: '{{ (pioggia | map(attribute=''precipitation'') | sum | float(0))
        | round(1, default=0) }}

        '
      prima_ora: "{% if pioggia | count > 0 %}\n  {{ (pioggia | first).datetime |
        as_datetime | as_local | strftime('%H:%M') }}\n{% else %}\n  nessuna\n{% endif
        %}\n"
  - condition: template
    value_template: '{{ pioggia | count > 0 and mm_totali > 0.2 }}'
  - action: notify.mobile_app_iphone_di_filippo
    data:
      title: Allerta Pioggia ☔
      message: 'È prevista pioggia stanotte tra le 00:00 e le 06:00. Totale stimato:
        {{ mm_totali }} mm. Prima pioggia prevista alle {{ prima_ora }}.

        '
      data:
        actions:
        - action: CHIUDI_FINESTRE
          title: Chiudi finestre
        - action: SNOOZE_1H
          title: Snooze 1h
  mode: single
