- id: '1792413020505'
  alias: Avviso finestra bagno aperta con riscaldamento acceso
  description: 'Con finestra del bagno aperta e pompa di calore in riscaldamento:
    abbassa il setpoint del termostato WC a 17 °C, mette in pausa la sua programmazione
    in Timeline e avvisa ogni 5 minuti (iPhone + Echo Show). Se la temperatura del
    bagno scende sotto i 17 °C gli avvisi diventano perentori (ogni 2 minuti, volume
    alto, notifica time-sensitive, Telegram e notifica persistente). Alla chiusura
    rilascia la pausa e Timeline ripristina il setpoint di programma. Se Timeline
    è in pausa globale non tocca il setpoint e si limita ad avvisare. La pausa viene
    rinnovata a ogni ciclo (30 min) come sicurezza.'
  triggers:
  - trigger: template
    id: allarme_on
    value_template: "{{ is_state('binary_sensor.sensore_dw_wc_contact', 'on')\n   and
      is_state('binary_sensor.remocon_net_heat_pump_heat', 'on') }}"
  - trigger: state
    id: allarme_off
    entity_id: binary_sensor.sensore_dw_wc_contact
    from: 'on'
    to: 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: allarme_on
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.allarme_finestra_bagno
      - variables:
          adesso: '{{ now().timestamp() | int }}'
          rp: '{{ state_attr(''sensor.timeline_stato'', ''room_pause'') or {} }}'
          tl_globale: '{{ is_state(''sensor.timeline_stato'', ''in_pausa'') }}'
          gestito: '{{ not tl_globale }}'
          zt: '{{ states(''input_text.zona_trattenuta'') }}'
          trattenuta_wc: '{{ zt.startswith(clima ~ ''|'') }}'
          setpoint_ora: '{{ state_attr(clima, ''temperature'') | float(0) }}'
          minimo: '{{ state_attr(clima, ''min_temp'') | float(16) }}'
          nuovo: '{{ [soglia | float(17), minimo] | max }}'
          nuovo_txt: '{{ ''%g'' | format(nuovo) }}'
          abbassa: '{{ gestito and setpoint_ora > nuovo }}'
          esito: '{% if tl_globale %}Timeline è in pausa globale: non ho toccato il
            setpoint, chiudi la finestra a mano.{% elif abbassa %}Ho abbassato il
            setpoint del bagno a {{ nuovo_txt }} gradi e messo in pausa la programmazione.{%
            else %}Ho messo in pausa la programmazione del bagno.{% endif %}'
      - if:
        - condition: template
          value_template: '{{ gestito and trattenuta_wc }}'
        then:
        - action: input_text.set_value
          target:
            entity_id: input_text.zona_trattenuta
          data:
            value: ''
      - if:
        - condition: template
          value_template: '{{ gestito }}'
        then:
        - action: thermostat_timeline.set_store
          data:
            settings:
              room_pause: '{{ dict(rp.items() | list + [(clima, {''indef'': false,
                ''until_ms'': (adesso + pausa_sec) * 1000})]) }}'
      - if:
        - condition: template
          value_template: '{{ abbassa }}'
        then:
        - delay: 3
        - action: climate.set_temperature
          target:
            entity_id: '{{ clima }}'
          data:
            temperature: '{{ nuovo }}'
        - action: logbook.log
          data:
            name: Finestra bagno
            message: 'Finestra aperta: {{ clima }} setpoint {{ setpoint_ora }} ->
              {{ nuovo }}, Timeline in pausa'
      - action: notify.mobile_app_iphone_di_filippo
        data:
          title: ⚠️ Finestra bagno aperta
          message: La finestra del bagno è aperta e il riscaldamento è in funzione.
            {{ esito }}
      - action: notify.send_message
        target:
          entity_id: notify.echo_show_speak
        data:
          message: La finestra del bagno è aperta e il riscaldamento è in funzione.
            {{ esito }}
      - repeat:
          while:
          - condition: state
            entity_id: binary_sensor.sensore_dw_wc_contact
            state: 'on'
          sequence:
          - variables:
              t_prima: '{% set t = state_attr(clima, ''current_temperature'') | float(0)
                %}{{ t if t > 0 else none }}'
          - delay: '{{ ''00:02:00'' if (t_prima is not none and t_prima < soglia |
              float(17)) else ''00:05:00'' }}'
          - condition: state
            entity_id: binary_sensor.sensore_dw_wc_contact
            state: 'on'
          - variables:
              adesso_l: '{{ now().timestamp() | int }}'
              rp_l: '{{ state_attr(''sensor.timeline_stato'', ''room_pause'') or {}
                }}'
              t: '{% set x = state_attr(clima, ''current_temperature'') | float(0)
                %}{{ x if x > 0 else none }}'
              sotto: '{{ t is not none and t < soglia | float(17) }}'
              t_txt: '{{ (t | round(1) | string | replace(''.'', '','')) if t is not
                none else ''n.d.'' }}'
          - if:
            - condition: template
              value_template: '{{ gestito }}'
            then:
            - action: thermostat_timeline.set_store
              data:
                settings:
                  room_pause: '{{ dict(rp_l.items() | list + [(clima, {''indef'':
                    false, ''until_ms'': (adesso_l + pausa_sec) * 1000})]) }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ sotto }}'
              sequence:
              - action: notify.mobile_app_iphone_di_filippo
                data:
                  title: "\U0001F6A8 Chiudi la finestra del bagno!"
                  message: Finestra aperta e il bagno è sceso a {{ t_txt }} °C (sotto
                    i {{ '%g' | format(soglia | float(17)) }}). Chiudila subito.
                  data:
                    push:
                      interruption-level: time-sensitive
              - action: telegram_bot.send_message
                data:
                  config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
                  message: "\U0001F6A8 *Chiudi la finestra del bagno!* La finestra
                    è ancora aperta e la temperatura è scesa a {{ t_txt }} °C."
              - action: persistent_notification.create
                data:
                  title: "\U0001F6A8 Finestra bagno aperta"
                  message: Il bagno è a {{ t_txt }} °C con la finestra aperta. Chiudila
                    subito.
                  notification_id: finestra_bagno_aperta
              - action: alexa_devices.send_text_command
                data:
                  device_id: 1b04930ba2c41eaeb44d4a61c03360b4
                  text_command: Imposta volume a 7
              - action: notify.send_message
                target:
                  entity_id: notify.echo_show_speak
                data:
                  message: Attenzione! Chiudi subito la finestra del bagno. La temperatura
                    è scesa a {{ t_txt }} gradi.
              - delay: 20
              - action: alexa_devices.send_text_command
                data:
                  device_id: 1b04930ba2c41eaeb44d4a61c03360b4
                  text_command: Imposta volume a 5
            default:
            - action: notify.mobile_app_iphone_di_filippo
              data:
                title: ⚠️ Finestra bagno ancora aperta
                message: 'La finestra del bagno è ancora aperta (bagno a {{ t_txt
                  }} °C).{% if gestito %} Setpoint tenuto basso e programmazione in
                  pausa fino alla chiusura.{% else %} Timeline è in pausa globale:
                  il setpoint non è stato abbassato.{% endif %}'
            - action: notify.send_message
              target:
                entity_id: notify.echo_show_speak
              data:
                message: Attenzione, la finestra del bagno è ancora aperta.
    - conditions:
      - condition: trigger
        id: allarme_off
      - condition: state
        entity_id: input_boolean.allarme_finestra_bagno
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.allarme_finestra_bagno
      - variables:
          adesso: '{{ now().timestamp() | int }}'
          rp: '{{ state_attr(''sensor.timeline_stato'', ''room_pause'') or {} }}'
          tl_globale: '{{ is_state(''sensor.timeline_stato'', ''in_pausa'') }}'
          esito: '{% if tl_globale %}Timeline è in pausa globale: controlla il setpoint
            del termostato del bagno.{% else %}Il bagno torna alla programmazione.{%
            endif %}'
      - action: thermostat_timeline.set_store
        data:
          settings:
            room_pause: '{{ dict(rp.items() | list + [(clima, {''indef'': false, ''until_ms'':
              (adesso + 2) * 1000})]) }}'
      - action: persistent_notification.dismiss
        data:
          notification_id: finestra_bagno_aperta
      - action: logbook.log
        data:
          name: Finestra bagno
          message: 'Finestra chiusa: pausa Timeline rilasciata. {{ esito }}'
      - action: notify.mobile_app_iphone_di_filippo
        data:
          title: ✅ Allarme rientrato
          message: La finestra del bagno è stata chiusa. {{ esito }}
      - action: notify.send_message
        target:
          entity_id: notify.echo_show_speak
        data:
          message: La finestra del bagno è stata chiusa. {{ esito }}
  mode: restart
  variables:
    clima: climate.termostato_wc
    soglia: 17
    pausa_sec: 1800
- id: '1792481996439'
  alias: Lavatrice - Avvio ciclo e previsione fine
  description: Annuncia l'avvio e, appena WashData stima la durata, la fine prevista.
  triggers:
  - trigger: event
    event_type: ha_washdata_cycle_started
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.lavatrice_ultima_soglia_notificata
    data:
      value: 0
  - action: script.lavatrice_notifica_telegram_voce
    data:
      messaggio: "\U0001F9FA▶️ La lavatrice è partita! Ti aggiorno appena stimo la
        fine del ciclo."
      voce: La lavatrice è partita.
  - wait_template: "{{ states('sensor.lavatrice_time_remaining') | is_number\n   and
      states('sensor.lavatrice_time_remaining') | float(0) > 0 }}\n"
    timeout: 00:15:00
    continue_on_timeout: false
  - variables:
      minuti: '{{ states(''sensor.lavatrice_time_remaining'') | float(0) | round(0)
        | int }}'
      fine: '{{ (now() + timedelta(minutes=minuti)).strftime(''%H:%M'') }}'
      programma: '{{ states(''sensor.lavatrice_program'') }}'
      programma_noto: '{{ programma not in [''unknown'', ''unavailable'', ''none'',
        ''''] }}'
  - action: script.lavatrice_notifica_telegram_voce
    data:
      messaggio: '⏱️ {% if programma_noto %}Programma: {{ programma }}.{% else %}Programma
        in riconoscimento.{% endif %} Mancano circa {{ minuti }} minuti, fine prevista
        alle {{ fine }}.

        '
      voce: 'Il ciclo della lavatrice finirà tra circa {{ minuti }} minuti, alle {{
        fine.replace('':'', '' e '') }}.

        '
  mode: single
- id: '1792482038448'
  alias: Lavatrice - Avanzamento e fine ciclo
  description: Aggiornamenti al 25/50/75% (una sola volta per soglia) e conferma finale.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.lavatrice_progress
    above: 25
    id: p25
  - trigger: numeric_state
    entity_id: sensor.lavatrice_progress
    above: 50
    id: p50
  - trigger: numeric_state
    entity_id: sensor.lavatrice_progress
    above: 75
    id: p75
  - trigger: event
    event_type: ha_washdata_cycle_ended
    id: fine
  actions:
  - variables:
      soglia: '{{ trigger.id[1:] | int(0) if trigger.id != ''fine'' else 100 }}'
      minuti: '{{ states(''sensor.lavatrice_time_remaining'') | float(0) | round(0)
        | int }}'
      fine: '{{ (now() + timedelta(minutes=minuti)).strftime(''%H:%M'') }}'
  - choose:
    - conditions:
      - condition: trigger
        id: fine
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.lavatrice_ultima_soglia_notificata
        data:
          value: 0
      - action: script.lavatrice_notifica_telegram_voce
        data:
          messaggio: "✅\U0001FAE7 Bucato pronto! La lavatrice ha terminato il ciclo:
            è il momento di stendere. \U0001F455"
          voce: La lavatrice ha terminato il ciclo. Il bucato è pronto da stendere.
    - conditions:
      - condition: template
        value_template: '{{ soglia > states(''input_number.lavatrice_ultima_soglia_notificata'')
          | float(0) }}

          '
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.lavatrice_ultima_soglia_notificata
        data:
          value: '{{ soglia }}'
      - action: script.lavatrice_notifica_telegram_voce
        data:
          messaggio: "\U0001F300 Lavatrice al {{ soglia }}% {% if minuti > 0 %}— mancano
            circa {{ minuti }} min (fine alle {{ fine }}){% endif %}\n"
          voce: 'La lavatrice è al {{ soglia }} per cento. {% if minuti > 0 %}Mancano
            circa {{ minuti }} minuti.{% endif %}

            '
  mode: queued
  max: 5
- id: '1792702017070'
  alias: Avviso riscaldamento attivo
  description: Notifica su iPhone e Telegram quando parte il compressore del riscaldamento,
    con l'elenco dei termostati attivi, tranne dalle 23 alle 8
  triggers:
  - trigger: state
    entity_id: binary_sensor.remocon_net_heat_pump_heat
    from: 'off'
    to: 'on'
  conditions:
  - condition: time
    after: 08:00:00
    before: '23:00:00'
  actions:
  - variables:
      nomi: "{{ states.climate\n   | selectattr('entity_id', 'match', 'climate.termostato_')\n
        \  | selectattr('attributes.hvac_action', 'defined')\n   | selectattr('attributes.hvac_action',
        'eq', 'heating')\n   | map(attribute='name')\n   | list }}"
      testo: 'Il compressore della pompa di calore è attivo.


        Termostati attivi:

        {% if nomi | length > 0 %}{{ ''• '' ~ nomi | join(''\n• '') }}{% else %}Nessuno{%
        endif %}'
  - action: notify.mobile_app_iphone_di_filippo
    data:
      title: ⌇⌇⌇ Riscaldamento acceso
      message: '{{ testo }}'
  - action: telegram_bot.send_message
    data:
      config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
      message: '*⌇⌇⌇ Riscaldamento acceso*


        {{ testo }}'
  mode: single
- id: '1792816349691'
  alias: Sicurezza - Notifica allarme scattato (da testare)
  description: 'Invia una notifica Telegram quando una delle tre partizioni Risco
    passa a "triggered", indicando quale partizione è scattata.

    '
  triggers:
  - trigger: state
    entity_id:
    - alarm_control_panel.risco_casetta_partition_1
    - alarm_control_panel.risco_casetta_partition_2
    - alarm_control_panel.risco_casetta_partition_0
    to:
    - triggered
  conditions: []
  actions:
  - action: telegram_bot.send_message
    data:
      config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
      message: "\U0001F6A8 ALLARME SCATTATO: {{ trigger.to_state.name }} ({{ trigger.entity_id
        }}) alle {{ now().strftime('%d/%m %H:%M:%S') }}. Verifica subito la situazione."
  mode: queued
  max: 10
- id: '1792997022653'
  alias: 'Riscaldamento: anomalia trend negativo (porte/finestre aperte?)'
  description: 'Avvisa se in una stanza il riscaldamento è in funzione (hvac_action
    = heating) ma il trend di temperatura (sensor.trend_temperatura_*, °C/h) è sotto
    -0,5 (discesa / discesa_rapida) da almeno 5 minuti. Utile per controllare porte
    o finestre aperte. Il bagno grande (wc) è escluso: ha il sensore finestra dedicato
    e si controlla da lì.

    '
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.trend_temperatura_salone
    - sensor.trend_temperatura_cucina
    - sensor.trend_temperatura_camera_francesco
    - sensor.trend_temperatura_camera_greta
    - sensor.trend_temperatura_camera_matrimoniale
    - sensor.trend_temperatura_wc_letto
    - sensor.trend_temperatura_suite_letto
    - sensor.trend_temperatura_suite_salone
    - sensor.trend_temperatura_wc_suite
    below: -0.5
    for: 300
  - trigger: state
    entity_id:
    - climate.termostato_salone
    - climate.termostato_cucina
    - climate.termostato_camera_francesco
    - climate.termostato_camera_greta
    - climate.termostato_camera_matrimoniale
    - climate.termostato_wc_letto
    - climate.termostato_suite_letto
    - climate.termostato_suite_salone
    - climate.termostato_wc_suite
    attribute: hvac_action
    to: heating
    for: 300
  conditions:
  - alias: Riscaldamento in funzione nella stanza
    condition: template
    value_template: '{{ state_attr(clima, ''hvac_action'') == ''heating'' }}'
  - alias: Trend valido e in discesa
    condition: template
    value_template: "{{ states(trend) not in ['unknown', 'unavailable']\n   and states(trend)
      | float(0) < -0.5 }}"
  actions:
  - variables:
      temp: '{{ state_attr(clima, ''current_temperature'') }}'
      setpoint: '{{ state_attr(clima, ''temperature'') }}'
      valore_trend: '{{ states(trend) | float(0) | round(1) }}'
  - action: notify.mobile_app_iphone_di_filippo
    data:
      title: 'Anomalia riscaldamento: {{ nome }}'
      message: Riscaldamento attivo ma temperatura in calo ({{ valore_trend }} °C/h,
        {{ temp }} °C, setpoint {{ setpoint }} °C). Verifica porte o finestre aperte.
  - action: telegram_bot.send_message
    data:
      config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
      message: '⚠️ {{ nome }}: riscaldamento attivo ma temperatura in calo ({{ valore_trend
        }} °C/h, {{ temp }} °C, setpoint {{ setpoint }} °C). Verificare porte o finestre
        aperte.'
  mode: parallel
  max: 10
  variables:
    nomi:
      salone: Soggiorno
      cucina: Cucina
      camera_francesco: Camera Francesco
      camera_greta: Camera Greta
      camera_matrimoniale: Camera Matrimoniale
      wc_letto: Bagno privato
      suite_letto: Suite - Camera
      suite_salone: Suite - Soggiorno
      wc_suite: Suite - Bagno
    chiave: "{{ trigger.entity_id.split('.')[1]\n   | replace('trend_temperatura_',
      '')\n   | replace('termostato_', '') }}"
    nome: '{{ nomi.get(chiave, chiave) }}'
    clima: '{{ ''climate.termostato_'' ~ chiave }}'
    trend: '{{ ''sensor.trend_temperatura_'' ~ chiave }}'
- id: '1793219188641'
  alias: Riscaldamento - gestisci/rilascia zona trattenuta
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id:
    - sensor.zone_in_riscaldamento
    - sensor.timeline_stato
    - binary_sensor.zona_altra_in_partenza
  conditions:
  - condition: template
    value_template: '{{ states(''input_text.zona_trattenuta'') | length > 0 }}'
  actions:
  - variables:
      p: '{{ states(''input_text.zona_trattenuta'').split(''|'') }}'
      eid: '{{ p[0] }}'
      base: '{{ p[1] | float(0) }}'
      livello: '{{ p[2] | int(1) }}'
      ts_passo: '{{ p[3] | int(0) }}'
      ts_inizio: '{{ p[4] | int(0) }}'
      adesso: '{{ now().timestamp() | int }}'
      n_zone: '{{ states(''sensor.zone_in_riscaldamento'') | int(0) }}'
      attive: '{{ state_attr(''sensor.zone_in_riscaldamento'', ''attive'') or [] }}'
      zone_attive_txt: '{% if attive | length > 0 %}{{ n_zone }} ({{ attive | map(''state_attr'',
        ''friendly_name'') | join('', '') }}){% else %}nessuna{% endif %}'
      in_partenza: "{% set m = {\n  'climate.termostato_salone': ['sensor.riscaldamento_attivo_salone_kblue',
        'sensor.trend_temperatura_salone'],\n  'climate.termostato_cucina': ['sensor.riscaldamento_attivo_cucina_kblue',
        'sensor.trend_temperatura_cucina'],\n  'climate.termostato_camera_francesco':
        ['sensor.riscaldamento_attivo_camera_francesco', 'sensor.trend_temperatura_camera_francesco'],\n
        \ 'climate.termostato_camera_greta': ['sensor.riscaldamento_attivo_cam_greta_kblue',
        'sensor.trend_temperatura_camera_greta'],\n  'climate.termostato_camera_matrimoniale':
        ['sensor.riscaldamento_attivo_letto_kblue', 'sensor.trend_temperatura_camera_matrimoniale'],\n
        \ 'climate.termostato_wc': ['sensor.riscaldamento_attivo_wc_kblue', 'sensor.trend_temperatura_wc'],\n
        \ 'climate.termostato_wc_letto': ['sensor.riscaldamento_attivo_wc_letto_kblue',
        'sensor.trend_temperatura_wc_letto'],\n  'climate.termostato_suite_letto':
        ['sensor.riscaldamento_attivo_letto_suite_kblue', 'sensor.trend_temperatura_suite_letto'],\n
        \ 'climate.termostato_suite_salone': ['sensor.riscaldamento_attivo_salone_suite_kblue',
        'sensor.trend_temperatura_suite_salone'],\n  'climate.termostato_wc_suite':
        ['sensor.riscaldamento_attivo_wc_suite_kblue', 'sensor.trend_temperatura_wc_suite']\n}
        %} {% set ns = namespace(nomi=[]) %} {% for c, v in m.items() if c != eid
        %} {% set t = state_attr(c, 'current_temperature') | float(none) %} {% set
        sp = state_attr(c, 'temperature') | float(none) %} {% set cl = state_attr(v[1],
        'classificazione') %} {% if states(c) not in ['off', 'unavailable', 'unknown']
        %} {% if is_state(v[0], 'on') %} {% set ns.nomi = ns.nomi + [state_attr(c,
        'friendly_name') ~ ' (riscaldamento attivo)'] %} {% elif t is not none and
        t != 0 and sp is not none and t <= sp and cl not in ['salita', 'salita_rapida']
        %} {% set ns.nomi = ns.nomi + [state_attr(c, 'friendly_name') ~ ' (ha raggiunto
        il setpoint: ' ~ (t | round(1)) ~ ' °C, setpoint ' ~ (sp | round(1)) ~ ' °C)']
        %} {% endif %} {% endif %} {% endfor %} {{ ns.nomi }}"
      temp: '{% set t = state_attr(eid, ''current_temperature'') | float(none) %}
        {{ t if t is not none and t != 0 else none }}'
      sola_attiva: '{{ n_zone == 1 and eid in attive }}'
      rp: '{{ state_attr(''sensor.timeline_stato'', ''room_pause'') or {} }}'
      min_trattenuta: '{{ ((adesso - ts_inizio) / 60) | round(0) | int }}'
      min_sola: '{{ ((adesso - ts_passo) / 60) | round(0) | int }}'
      motivo: '{% if is_state(''binary_sensor.zona_altra_in_partenza'', ''on'') %}
        {% if in_partenza | length > 0 %}{{ in_partenza | join(''; '') }}{% else %}un''altra
        zona (non identificata){% endif %} {% elif is_state(''sensor.timeline_stato'',
        ''in_pausa'') %} pausa globale Timeline attiva {% elif states(eid) in [''off'',
        ''unavailable'', ''unknown''] %} termostato non disponibile (stato: {{ states(eid)
        }}) {% elif temp is not none and temp < base - 1.0 %} temperatura {{ temp
        | round(1) }} °C sotto il limite di {{ base - 1.0 }} °C {% elif adesso - ts_inizio
        > 7200 %} trattenuta da {{ min_trattenuta }} min, superato il limite di sicurezza
        di 120 min {% elif livello >= 2 and sola_attiva and adesso - ts_passo >= 300
        %} unica zona attiva da {{ min_sola }} min con setpoint già abbassato di 1
        °C {% endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ motivo | trim | length > 0 }}'
      sequence:
      - action: thermostat_timeline.set_store
        data:
          settings:
            room_pause: '{{ dict(rp.items() | list + [(eid, {''indef'': false, ''until_ms'':
              (adesso + 2) * 1000})]) }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.zona_trattenuta
        data:
          value: ''
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.zona_ultimo_rilascio
        data:
          timestamp: '{{ adesso }}'
      - action: logbook.log
        data:
          name: Riscaldamento zona singola
          message: 'Rilasciata {{ eid }}: {{ motivo | trim }}'
      - event: riscaldamento_zona_rilasciata
        event_data:
          zona: '{{ eid }}'
          nome: '{{ state_attr(eid, ''friendly_name'') }}'
          setpoint_base: '{{ base }}'
          motivo: '{{ motivo | trim }}'
          zone_attive: '{{ zone_attive_txt }}'
          durata_min: '{{ min_trattenuta }}'
      - action: script.riscaldamento_notifica
        data:
          titolo: 'Riscaldamento: zona rilasciata'
          messaggio: '{{ state_attr(eid, ''friendly_name'') }} rilasciata, Timeline
            ripristina il setpoint di programma ({{ base }} °C). Motivo: {{ motivo
            | trim }}. Zone attive: {{ zone_attive_txt }}.'
    - conditions:
      - condition: template
        value_template: '{{ livello == 1 and sola_attiva and adesso - ts_passo >=
          300 }}'
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: '{{ eid }}'
        data:
          temperature: '{{ base - 1.0 }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.zona_trattenuta
        data:
          value: '{{ eid }}|{{ base }}|2|{{ adesso }}|{{ ts_inizio }}'
      - event: riscaldamento_zona_secondo_gradino
        event_data:
          zona: '{{ eid }}'
          nome: '{{ state_attr(eid, ''friendly_name'') }}'
          setpoint_base: '{{ base }}'
          setpoint: '{{ base - 1.0 }}'
          temperatura: '{{ temp }}'
          durata_min: '{{ min_trattenuta }}'
      - action: script.riscaldamento_notifica
        data:
          titolo: 'Riscaldamento: secondo gradino'
          messaggio: '{{ state_attr(eid, ''friendly_name'') }} ancora sola in riscaldamento:
            setpoint abbassato a {{ base - 1.0 }} °C (massimo -1 °C).'
  mode: single
- id: '1793219320776'
  alias: Riscaldamento - trattieni zona singola (preventivo o di ripiego)
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: input_text.zona_trattenuta
    state: ''
  - condition: state
    entity_id: sensor.timeline_stato
    state: attivo
  - condition: template
    value_template: '{{ states(''sensor.zona_da_trattenere'') not in [''nessuna'',
      ''unknown'', ''unavailable''] }}'
  - condition: template
    value_template: '{{ as_timestamp(now()) - as_timestamp(states(''input_datetime.zona_ultimo_rilascio''),
      0) >= 300 }}'
  - condition: template
    value_template: '{% set st = states(''sensor.zona_da_trattenere'').replace(''climate.termostato_'',
      '''') %} {{ as_timestamp(now()) - as_timestamp(states(''input_datetime.trattenuta_''
      ~ st), 0) >= 1800 }}'
  - condition: template
    value_template: "{{ state_attr('sensor.zona_da_trattenere', 'motivo') == 'preventivo'\n
      \  or (now() - states.sensor.zone_in_riscaldamento.last_changed).total_seconds()
      >= 30 }}"
  - condition: template
    value_template: "{{ not (is_state('input_boolean.allarme_finestra_bagno', 'on')\n
      \       and states('sensor.zona_da_trattenere') == 'climate.termostato_wc')
      }}"
  actions:
  - variables:
      eid: '{{ states(''sensor.zona_da_trattenere'') }}'
      stanza: '{{ eid.replace(''climate.termostato_'', '''') }}'
      motivo_hold: '{{ state_attr(''sensor.zona_da_trattenere'', ''motivo'') }}'
      base: '{{ state_attr(eid, ''temperature'') | float(0) }}'
      minimo: '{{ state_attr(eid, ''min_temp'') | float(5) }}'
      nuovo: '{{ base - 0.5 }}'
      adesso: '{{ now().timestamp() | int }}'
      rp: '{{ state_attr(''sensor.timeline_stato'', ''room_pause'') or {} }}'
      fine_ms: '{{ (adesso + 7200) * 1000 }}'
  - condition: template
    value_template: '{{ base > 0 and nuovo >= minimo and states(eid) in [''auto'',
      ''heat''] }}'
  - action: thermostat_timeline.set_store
    data:
      settings:
        room_pause: '{{ dict(rp.items() | list + [(eid, {''indef'': false, ''until_ms'':
          fine_ms})]) }}'
  - delay: 3
  - action: climate.set_temperature
    target:
      entity_id: '{{ eid }}'
    data:
      temperature: '{{ nuovo }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.zona_trattenuta
    data:
      value: '{{ eid }}|{{ base }}|1|{{ adesso }}|{{ adesso }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.trattenuta_{{ stanza }}
    data:
      timestamp: '{{ adesso }}'
  - action: logbook.log
    data:
      name: Riscaldamento zona singola
      message: 'Trattenuta ({{ motivo_hold }}) {{ eid }}: setpoint {{ base }} -> {{
        nuovo }}'
  - event: riscaldamento_zona_trattenuta
    event_data:
      zona: '{{ eid }}'
      nome: '{{ state_attr(eid, ''friendly_name'') }}'
      setpoint_base: '{{ base }}'
      setpoint: '{{ nuovo }}'
      temperatura: '{{ state_attr(eid, ''current_temperature'') }}'
      motivo: '{{ motivo_hold }}'
  - action: script.riscaldamento_notifica
    data:
      titolo: 'Riscaldamento: zona trattenuta'
      messaggio: '{{ state_attr(eid, ''friendly_name'') }} {{ ''stava per partire
        da sola'' if motivo_hold == ''preventivo'' else "era l''unica zona in riscaldamento"
        }}: setpoint {{ base }} -> {{ nuovo }} °C (temperatura {{ state_attr(eid,
        ''current_temperature'') }} °C). Evito la partenza dell''impianto per una
        sola zona.'
  mode: single
- id: '1793448449064'
  alias: Riscaldamento - Report serale
  description: Resoconto alle 23:00 del funzionamento del riscaldamento, con stima
    del consumo della pompa di calore, scritto da Claude
  triggers:
  - trigger: time
    at: '23:00:00'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ eventi | count == 0 }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.homeassistant_filippo_8511463273
        data:
          message: "\U0001F525 Riscaldamento: oggi non è entrato in funzione. Esterna
            oggi: min {{ ext_min }} °C, max {{ ext_max }} °C (ora {{ ext_ora }} °C).
            Consumo stimato pompa di calore: {{ pompa_kwh }} kWh (circa {{ pompa_costo
            }} €).\n"
    default:
    - action: conversation.process
      data:
        agent_id: conversation.claude_conversation
        text: "Scrivi in italiano un resoconto breve (max 8 righe, tono sintetico,
          qualche emoji ok) del riscaldamento di oggi. Non controllare né modificare
          dispositivi: usa solo i dati qui sotto, senza inventare nulla.\nCome leggere
          il log: ogni evento è una zona che passa a \"on\" (riscaldamento in funzione)
          o \"off\" (in temperatura). La zona \"IMPIANTO\" indica che almeno una zona
          sta scaldando, quindi la sua durata è il tempo di funzionamento dell'impianto.
          Calcola le durate accoppiando on/off di ogni zona; gli eventi delle 00:00
          con nota sono continuazioni del giorno prima. Se l'ultimo evento di una
          zona è \"on\" ed è ancora accesa ora, dillo.\nIndica: tempo totale di funzionamento
          e numero di accensioni dell'impianto, temperatura esterna (minima, massima
          di oggi e valore attuale), quanto ci ha messo ogni zona ad andare in temperatura,
          quali zone sono ancora in riscaldamento e il consumo elettrico stimato della
          pompa di calore con il costo. Consumo e costo sono stime (la pompa non ha
          un contatore dedicato): scrivili come \"circa\" e non commentarli oltre.\nDATI
          - Esterna oggi: min {{ ext_min }} °C, max {{ ext_max }} °C,\n  alle 23:00
          {{ ext_ora }} °C\n- Consumo stimato pompa di calore oggi: {{ pompa_kwh }}
          kWh,\n  costo stimato {{ pompa_costo }} €\n- Zone ancora in riscaldamento:
          {{ accese_ora }} - Log eventi (ora, zona, stato, temperatura esterna): {{
          eventi }}\n"
      response_variable: ai
    - action: notify.send_message
      target:
