- id: kblue_notifica_termostato_manuale
  alias: KBlue - Notifica termostati in manuale
  description: Avvisa quando un termostato passa in manuale (da pannello, app o HA)
    e ripete ogni ora finche' ce n'e' almeno uno
  mode: single
  triggers:
  - trigger: state
    entity_id:
    - sensor.modo_manuale_salone_kblue
    - sensor.modo_manuale_cucina_kblue
    - sensor.modo_manuale_letto_kblue
    - sensor.modo_manuale_camera_francesco_kblue
    - sensor.modo_manuale_cam_greta_kblue
    - sensor.modo_manuale_letto_suite_kblue
    - sensor.modo_manuale_salone_suite_kblue
    - sensor.modo_manuale_wc_kblue
    - sensor.modo_manuale_wc_letto_kblue
    - sensor.modo_manuale_wc_suite_kblue
    from: '0'
    id: cambio_stato
  - trigger: time_pattern
    hours: /1
    id: promemoria
  variables:
    zone:
      sensor.modo_manuale_salone_kblue: Salone
      sensor.modo_manuale_cucina_kblue: Cucina
      sensor.modo_manuale_letto_kblue: Camera Nostra
      sensor.modo_manuale_camera_francesco_kblue: Camera Francesco
      sensor.modo_manuale_cam_greta_kblue: Camera Greta
      sensor.modo_manuale_letto_suite_kblue: Camera Suite
      sensor.modo_manuale_salone_suite_kblue: Salone Suite
      sensor.modo_manuale_wc_kblue: Bagno Grande
      sensor.modo_manuale_wc_letto_kblue: Bagno Camera
      sensor.modo_manuale_wc_suite_kblue: Bagno Suite
    manuali: "{% set ns = namespace(l=[]) %} {% for e, n in zone.items() %}\n  {%
      if states(e) not in ['0', 'unknown', 'unavailable'] %}\n    {% set ns.l = ns.l
      + [n] %}\n  {% endif %}\n{% endfor %} {{ ns.l | join(', ') }}"
  conditions:
  - condition: template
    value_template: '{{ manuali | length > 0 }}'
  actions:
  - action: persistent_notification.create
    data:
      title: "\U0001F525 Termostati in manuale"
      message: 'In manuale: {{ manuali }}'
      notification_id: kblue_termostati_manuali
  - action: telegram_bot.send_message
    metadata: {}
    data:
      title: "\U0001F525 Termostati in manuale"
      message: 'In manuale: {{ manuali }}'
      config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
