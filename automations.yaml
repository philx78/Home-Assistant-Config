- id: '1786981613315'
  alias: Sicurezza - Arma zona comune in modalità notte (versione smart da testare)
  description: 'Richiamata da un''altra automazione. Attende un grace period di 10
    minuti (con notifica di avvio) prima di valutare la zona giorno. Se, trascorso
    il grace period, l''allarme risulta già armato manualmente, notifica e si ferma;
    se risulta "triggered" (intrusione in corso), invia un avviso distinto e si ferma
    senza toccare nulla. Altrimenti: se la zona giorno è libera (luci spente e nessuna
    presenza), arma subito senza chiedere; se occupata, chiede conferma via Telegram
    (arma subito / attendi che si liberi / non armare). In caso di "attendi" o nessuna
    risposta entro 5 minuti, attesa intelligente con timeout di sicurezza di 1 ora.
    Prima di ogni armamento verifica sempre lo stato dell''allarme, distinguendo "triggered"
    da "già armato manualmente".

    '
  triggers: []
  conditions: []
  actions:
  - action: telegram_bot.send_message
    data:
      config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
      message: "\U0001F319 Sicurezza notturna: l'attività nella zona giorno verrà
        verificata tra 10 minuti."
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - choose:
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.risco_casetta_partition_1
        state: triggered
      sequence:
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          message: "\U0001F6A8 Allarme in corso (stato \"triggered\"): non eseguo
            alcuna azione automatica, verifica subito la situazione."
      - stop: Allarme in stato triggered durante il grace period
    - conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: alarm_control_panel.risco_casetta_partition_1
          state: triggered
        - condition: state
          entity_id: alarm_control_panel.risco_casetta_partition_1
          state: disarmed
      sequence:
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          message: 'ℹ️ Sicurezza notturna: l''allarme risulta già armato manualmente
            durante l''attesa. Nessuna ulteriore azione necessaria.'
      - stop: Allarme già armato manualmente durante il grace period
    default:
    - choose:
      - conditions:
        - condition: state
          entity_id: light.luci_zona_giorno
          state: 'off'
        - condition: state
          entity_id: binary_sensor.presenza_salone_presence
          state: 'off'
        - condition: state
          entity_id: binary_sensor.s3_box_bedroom_presence_detect
          state: 'off'
        sequence:
        - choose:
          - conditions:
            - condition: state
              entity_id: alarm_control_panel.risco_casetta_partition_1
              state: triggered
            sequence:
            - action: telegram_bot.send_message
              data:
                config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
                message: "\U0001F6A8 Allarme in corso (stato \"triggered\"): non eseguo
                  alcuna azione automatica, verifica subito la situazione."
          - conditions:
            - condition: state
              entity_id: alarm_control_panel.risco_casetta_partition_1
              state: disarmed
            sequence:
            - action: alarm_control_panel.alarm_arm_home
              target:
                entity_id: alarm_control_panel.risco_casetta_partition_1
            - action: telegram_bot.send_message
              data:
                config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
                message: "\U0001F512 Sicurezza notturna: non risulta attività nella
                  zona giorno, zona comune armata automaticamente"
          - conditions:
            - condition: not
              conditions:
              - condition: state
                entity_id: alarm_control_panel.risco_casetta_partition_1
                state: triggered
              - condition: state
                entity_id: alarm_control_panel.risco_casetta_partition_1
                state: disarmed
            sequence:
            - action: telegram_bot.send_message
              data:
                config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
                message: 'ℹ️ Sicurezza notturna: la zona comune risulta già armata
                  manualmente. Nessuna ulteriore azione necessaria.'
      default:
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          message: "\U0001F319 Sicurezza notturna: rilevata attività e/o luci ancora
            accese nella zona giorno. Come vuoi gestire l'allarme?"
          inline_keyboard:
          - ✅ Arma subito:/arma_subito
          - ⏳ Attendi zona libera:/attendi_zona_libera
          - "\U0001F6AB Non armare:/non_armare"
      - wait_for_trigger:
        - trigger: event
          event_type: telegram_callback
          event_data:
            data: /arma_subito
        - trigger: event
          event_type: telegram_callback
          event_data:
            data: /attendi_zona_libera
        - trigger: event
          event_type: telegram_callback
          event_data:
            data: /non_armare
        timeout:
          minutes: 5
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.event.data.data
              == ''/arma_subito'' }}'
          sequence:
          - action: telegram_bot.answer_callback_query
            data:
              callback_query_id: '{{ wait.trigger.event.data.id }}'
              message: ✅ Allarme attivato
          - choose:
            - conditions:
              - condition: state
                entity_id: alarm_control_panel.risco_casetta_partition_1
                state: triggered
              sequence:
              - action: telegram_bot.send_message
                data:
                  config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
                  message: "\U0001F6A8 Allarme in corso (stato \"triggered\"): non
                    eseguo alcuna azione automatica, verifica subito la situazione."
            - conditions:
              - condition: state
                entity_id: alarm_control_panel.risco_casetta_partition_1
                state: disarmed
              sequence:
              - action: alarm_control_panel.alarm_arm_home
                target:
                  entity_id: alarm_control_panel.risco_casetta_partition_1
              - action: telegram_bot.send_message
                data:
                  config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
                  message: "\U0001F512 Allarme zona comune attivato subito, su tua
                    conferma."
            - conditions:
              - condition: not
                conditions:
                - condition: state
                  entity_id: alarm_control_panel.risco_casetta_partition_1
                  state: triggered
                - condition: state
                  entity_id: alarm_control_panel.risco_casetta_partition_1
                  state: disarmed
              sequence:
              - action: telegram_bot.send_message
                data:
                  config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
                  message: ℹ️ Allarme già armato manualmente, nessuna azione necessaria.
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.event.data.data
              == ''/non_armare'' }}'
          sequence:
          - action: telegram_bot.answer_callback_query
            data:
              callback_query_id: '{{ wait.trigger.event.data.id }}'
              message: "\U0001F6AB Ok, non armo"
          - action: telegram_bot.send_message
            data:
              config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
              message: "\U0001F6AB Allarme non attivato stanotte. Non farò altri tentativi:
                se cambi idea, armalo manualmente da app o Alexa."
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none and wait.trigger.event.data.data
              == ''/attendi_zona_libera'' }}'
          sequence:
          - action: telegram_bot.answer_callback_query
            data:
              callback_query_id: '{{ wait.trigger.event.data.id }}'
              message: ⏳ Ok, attendo
          - action: telegram_bot.send_message
            data:
              config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
              message: ⏳ Attendo che la zona giorno sia libera (luci spente o nessuna
                presenza per 10 min). Se non succede entro 1 ora, armo comunque per
                sicurezza. Ti avviso quando armo.
        default:
        - action: telegram_bot.send_message
          data:
            config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
            message: ⏱️ Nessuna risposta entro 5 minuti. Passo comunque in attesa
              della zona giorno libera (luci spente o nessuna presenza per 10 min),
              con armamento automatico entro 1 ora. Ti avviso quando armo.
      - condition: template
        value_template: '{{ wait.trigger is none or wait.trigger.event.data.data ==
          ''/attendi_zona_libera'' }}'
      - wait_for_trigger:
        - trigger: state
          entity_id: light.luci_zona_giorno
          to: 'off'
        - trigger: template
          value_template: '{{ is_state(''binary_sensor.presenza_salone_presence'',
            ''off'') and is_state(''binary_sensor.s3_box_bedroom_presence_detect'',
            ''off'') }}'
          for:
            minutes: 10
        timeout:
          hours: 1
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: state
            entity_id: alarm_control_panel.risco_casetta_partition_1
            state: triggered
          sequence:
          - action: telegram_bot.send_message
            data:
              config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
              message: "\U0001F6A8 Allarme in corso (stato \"triggered\"): non eseguo
                alcuna azione automatica, verifica subito la situazione."
        - conditions:
          - condition: state
            entity_id: alarm_control_panel.risco_casetta_partition_1
            state: disarmed
          sequence:
          - action: alarm_control_panel.alarm_arm_home
            target:
              entity_id: alarm_control_panel.risco_casetta_partition_1
          - action: telegram_bot.send_message
            data:
              config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
              message: "{{ '\U0001F512 Allarme armato automaticamente dopo 1 ora (timeout
                di sicurezza, zona giorno non rilevata libera)' if wait.trigger is
                none else '\U0001F512 Allarme armato: zona giorno libera (luci spente
                o nessuna presenza)' }}"
        - conditions:
          - condition: not
            conditions:
            - condition: state
              entity_id: alarm_control_panel.risco_casetta_partition_1
              state: triggered
            - condition: state
              entity_id: alarm_control_panel.risco_casetta_partition_1
              state: disarmed
          sequence:
          - action: telegram_bot.send_message
            data:
              config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
              message: ℹ️ Allarme già armato manualmente nel frattempo, nessuna azione
                necessaria.
  mode: single
