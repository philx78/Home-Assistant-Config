- id: '1775590119998'
  alias: AWTRIX - Previsioni meteo 12 ore
  description: ''
  triggers:
  - trigger: time_pattern
    hours: /1
  - trigger: homeassistant
    event: start
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.openweathermap
    data:
      type: hourly
    response_variable: forecast
  - action: mqtt.publish
    data:
      topic: awtrix_3e5e6c/custom/meteo12h
      evaluate_payload: true
      payload: "{% set ns = namespace(result=[]) %} {% set items = forecast['weather.openweathermap']['forecast'][:12]
        %} {% for f in items %}\n  {% set ora = f.datetime[11:13] %}\n  {% set t =
        f.temperature | round(0) | int %}\n  {% set rain = f.precipitation | round(1)
        %}\n  {% set prob = f.precipitation_probability | int %}\n  {% set wind =
        (f.wind_speed * 3.6) | round(0) | int %}\n  {% set testo = ora ~ \"h \" ~
        t ~ \"° P\" ~ prob ~ \"% \" ~ rain ~ \"mm V\" ~ wind ~ \"kmh\" %}\n  {% set
        ns.result = ns.result + [testo] %}\n{% endfor %} {{ {\"text\": ns.result |
        join(\" | \"), \"icon\": \"11201\", \"duration\": 60, \"scrollSpeed\": 50}
        | tojson }}\n"
- id: '1776198745010'
  alias: Meteo - Allerta Pioggia - Notifica 12h
  description: Notifica su iPhone se prevista pioggia nelle prossime 12 ore (07:30-22:30)
  triggers:
  - trigger: time_pattern
    hours: /2
  conditions:
  - condition: time
    after: 07:30:00
    before: '22:30:00'
    enabled: false
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.openweathermap
    data:
      type: hourly
    response_variable: forecast
  - variables:
      ore_pioggia: "{% set items = forecast['weather.openweathermap']['forecast'][:12]
        %} {% set ns = namespace(result=[]) %} {% for f in items %}\n  {% set prob
        = f.get('precipitation_probability', 0) | int %}\n  {% set rain = f.get('precipitation',
        0) | float %}\n  {% set cond = f.get('condition', '') %}\n  {% if prob >=
        40 or rain > 0.2 or cond in ['rainy','pouring','lightning-rainy'] %}\n    {%
        set ora = (f.datetime | as_datetime | as_local).strftime('%H') %}\n    {%
        set ns.result = ns.result + [ora ~ \"h prob=\" ~ prob ~ \"% rain=\" ~ rain
        ~ \"mm cond=\" ~ cond] %}\n  {% endif %}\n{% endfor %} {{ ns.result }}\n"
      pioggia_prevista: '{{ ore_pioggia | length > 0 }}'
  - condition: template
    value_template: '{{ pioggia_prevista }}'
  - action: rest_command.claude_weather_forecast
    data:
      message: 'Sei un assistente meteo. Ricevi i dati orari di pioggia prevista nelle
        prossime 6 ore e produci un messaggio di notifica breve (max 2 frasi) in italiano.
        Indica quando inizia la pioggia, per quanto dura e l''intensità. Sii conciso
        e diretto, niente preamboli. Dati: {{ ore_pioggia | join('' | '') }}

        '
    response_variable: claude_response
  - variables:
      testo_notifica: "{% set content = claude_response.get('content', {}) %} {% if
        content is mapping %}\n  {{ content.get('content', [{}])[0].get('text', 'Pioggia
        prevista nelle prossime ore.') }}\n{% else %}\n  Pioggia prevista nelle prossime
        ore.\n{% endif %}\n"
  - action: notify.mobile_app_iphone_di_filippo
    data:
      title: "\U0001F327 Pioggia in arrivo"
      message: '{{ testo_notifica | trim }}'
      data:
        push:
          sound: default
    enabled: false
  - action: telegram_bot.send_message
    metadata: {}
    data:
      message: '{{ testo_notifica | trim }}'
      title: "\U0001F327 Pioggia in arrivo"
- id: '1776283524411'
  alias: Meteo (RainViewer) - Controllo pioggia ogni 10 min
  description: Controlla il radar RainViewer ogni 10 minuti e invia un alert Telegram
    al primo rilevamento di pioggia. Il flag anti-spam si resetta quando smette di
    piovere.
  triggers:
  - trigger: time_pattern
    minutes: /10
  conditions:
  - condition: time
    after: 06:00:00
    before: '23:00:00'
  actions:
  - action: shell_command.rainviewer_check
    response_variable: risultato
  - variables:
      esito: '{{ risultato.stdout | from_json if risultato.returncode == 0 else none
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ esito is not none and esito.pioggia }}'
      - condition: state
        entity_id: input_boolean.alert_pioggia_inviato
        state: 'off'
      sequence:
      - action: telegram_bot.send_message
        data:
          config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
          title: "\U0001F327️ Alert Meteo"
          message: Il radar segnala precipitazioni vicino a casa alle {{ now().strftime('%H:%M')
            }}. ☂️ Ritira i panni se sono stesi! (dati radar aggiornati {{ esito.frame_minuti_fa
            }} min fa)
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.alert_pioggia_inviato
    - conditions:
      - condition: template
        value_template: '{{ esito is not none and not esito.pioggia }}'
      - condition: state
        entity_id: input_boolean.alert_pioggia_inviato
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alert_pioggia_inviato
  mode: single
