- id: '1769195888142'
  alias: Avviso pochi termostati attivi
  description: Notifica quando ci sono solo 1 o 2 termostati attivi per più di 5 minuti
  triggers:
  - trigger: template
    value_template: "{% set attivi = [\n  states('sensor.riscaldamento_attivo_salone_kblue'),\n
      \ states('sensor.riscaldamento_attivo_cucina_kblue'),\n  states('sensor.riscaldamento_attivo_camera_francesco'),\n
      \ states('sensor.riscaldamento_attivo_cam_greta_kblue'),\n  states('sensor.riscaldamento_attivo_letto_kblue'),\n
      \ states('sensor.riscaldamento_attivo_wc_kblue'),\n  states('sensor.riscaldamento_attivo_wc_letto_kblue'),\n
      \ states('sensor.riscaldamento_attivo_salone_suite_kblue'),\n  states('sensor.riscaldamento_attivo_letto_suite_kblue'),\n
      \ states('sensor.riscaldamento_attivo_wc_suite_kblue')\n] | select('equalto',
      'on') | list | count %}\n{{ attivi >= 1 and attivi <= 2 }}\n"
    for:
      minutes: 5
  conditions:
  - condition: template
    value_template: "{{ this.last_triggered is none or\n   (now() - this.last_triggered).total_seconds()
      > 900 }}\n"
  actions:
  - data:
      title: ⚠️ Pochi termostati attivi
      message: "{% set ns = namespace(attivi=0, lista='') %} {% set termostati = {\n
        \ 'sensor.riscaldamento_attivo_salone_kblue': 'Soggiorno',\n  'sensor.riscaldamento_attivo_cucina_kblue':
        'Cucina',\n  'sensor.riscaldamento_attivo_camera_francesco': 'Camera Francesco',\n
        \ 'sensor.riscaldamento_attivo_cam_greta_kblue': 'Camera Greta',\n  'sensor.riscaldamento_attivo_letto_kblue':
        'Camera Matrimoniale',\n  'sensor.riscaldamento_attivo_wc_kblue': 'Bagno grande',\n
        \ 'sensor.riscaldamento_attivo_wc_letto_kblue': 'Bagno privato',\n  'sensor.riscaldamento_attivo_salone_suite_kblue':
        'Soggiorno Suite',\n  'sensor.riscaldamento_attivo_letto_suite_kblue': 'Camera
        Suite',\n  'sensor.riscaldamento_attivo_wc_suite_kblue': 'Bagno Suite'\n}
        %} {% for termostato, nome in termostati.items() %}\n  {% if is_state(termostato,
        'on') %}\n    {% set ns.attivi = ns.attivi + 1 %}\n    {% set ns.lista = ns.lista
        ~ '\U0001F525 ' ~ nome ~ '\\n' %}\n  {% endif %}\n{% endfor %} Solo {{ ns.attivi
        }} termostato{% if ns.attivi > 1 %}i{% endif %} attivo{% if ns.attivi > 1
        %}i{% endif %} su 10: {{ ns.lista }}\n"
    action: notify.notify
  mode: single
