- id: '1768025133547'
  alias: Avviso Pioggia Diurna (Met.no)
  description: Notifica se inizia a piovere o è prevista pioggia nella giornata (orario
    diurno)
  triggers:
  - trigger: state
    entity_id: weather.forecast_home
    to:
    - rainy
    - pouring
    - lightning-rainy
    - snowy-rainy
    for:
      minutes: 5
  - trigger: time
    at:
    - 07:07:00
    - '11:00:00'
    - '15:00:00'
    - '18:00:00'
  conditions:
  - condition: time
    after: 07:00:00
    before: '22:00:00'
  - condition: numeric_state
    entity_id: sensor.precip_today_mm
    below: 8
  actions:
  - variables:
      now_time: '{{ now() }}'
      today_date: '{{ now().date() }}'
      forecasts: "{{ \n  (weather.get_forecasts({\n    'entity_id': 'weather.forecast_home',\n
        \   'type': 'hourly'\n  }))['weather.forecast_home'].forecast \n}}\n"
      pioggia_oggi: "{{ forecasts \n  | selectattr('datetime', 'as_timestamp') \n
        \ | select('>=', today_date.timestamp()) \n  | select('<=', (today_date +
        timedelta(days=1)).timestamp()) \n  | selectattr('condition', 'search', 'rain')
        \n  | list \n}}\n"
      mm_previsti_oggi: '{{ (pioggia_oggi | map(attribute=''precipitation'') | sum
        | float(0)) | round(1) }}

        '
      prossima_precip: "{% set candidates = forecasts \n  | selectattr('precipitation',
        '>', 0.2) \n  | selectattr('datetime', '>', now_time) \n  | sort(attribute='datetime')
        \n  | list %}\n{% if candidates | count > 0 %}\n  {{ candidates[0].datetime
        | as_datetime | as_local | strftime('%H:%M') }}\n{% else %}\n  nessuna\n{%
        endif %}\n"
  - condition: or
    conditions:
    - condition: trigger
      id: state
    - condition: template
      value_template: '{{ mm_previsti_oggi > 1.5 and mm_totali_oggi < 3 }}'
  - action: notify.mobile_app_iphone_di_filippo
    data:
      title: '{{ ''Pioggia in corso!'' if trigger.to_state.state in [''rainy'',''pouring'']
        else ''Pioggia prevista oggi ☔'' }}'
      message: '{% if trigger.to_state.state in [''rainy'',''pouring'',''lightning-rainy'']
        %} Ha iniziato a piovere!  {% else %} È prevista pioggia oggi: ~{{ mm_previsti_oggi
        }} mm totali. Prima precipitazione attesa intorno alle {{ prossima_precip
        }}. {% endif %}

        '
      data:
        actions:
        - action: CHIUDI_FINESTRE
          title: Chiudi finestre
        - action: SNOOZE_RAIN_2H
          title: Snooze 2h
  mode: single
