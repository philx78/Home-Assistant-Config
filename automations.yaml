- id: '1780042467764'
  alias: Notifica se ci sono luci accese durante il giorno
  description: Notifica se ci sono luci accese tra alba e tramonto
  triggers:
  - minutes: /10
    trigger: time_pattern
  - event: sunrise
    offset: +00:30:00
    trigger: sun
  - event: sunset
    trigger: sun
    id: reset
  conditions: []
  actions:
  - if:
    - condition: trigger
      id: reset
    then:
    - entity_id: input_boolean.notifica_luci_giorno_inviata
      action: input_boolean.turn_off
    else:
    - condition: sun
      after: sunrise
      before: sunset
    - condition: template
      value_template: "{% set escluse = label_entities('escludi_notifica_luci') %}\n{{
        states.light\n   | rejectattr('entity_id', 'in', escluse)\n   | selectattr('state',
        'eq', 'on')\n   | list | count > 0 }}\n"
    - condition: state
      entity_id: input_boolean.notifica_luci_giorno_inviata
      state: 'off'
    - entity_id: input_boolean.notifica_luci_giorno_inviata
      action: input_boolean.turn_on
    - action: telegram_bot.send_message
      data:
        config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
        message: "\U0001F4A1 *Luci accese di giorno*\n{% set escluse = label_entities('escludi_notifica_luci')
          %}\n{% set luci = states.light\n   | rejectattr('entity_id', 'in', escluse)\n
          \  | selectattr('state', 'eq', 'on')\n   | map(attribute='name')\n   | list
          %}\n{{ luci | join(', ') }}\n"
