- id: '1783002472634'
  alias: Meteo - Briefing meteo mattutino - fuori Roma
  description: Alle 7:30 se Filippo è a più di 50km da Roma, genera briefing meteo
    locale con Claude
  triggers:
  - at: 07:30:00
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ distance(''person.filippo_durzu'', ''zone.home'') | float
      > 50 }}

      '
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.openweathermap
    data:
      type: daily
    response_variable: forecast
  - variables:
      lat: '{{ state_attr(''person.filippo_durzu'', ''latitude'') | round(4) }}'
      lon: '{{ state_attr(''person.filippo_durzu'', ''longitude'') | round(4) }}'
      oggi: '{{ forecast[''weather.openweathermap''][''forecast''][0] }}'
      domani: '{{ forecast[''weather.openweathermap''][''forecast''][1] }}'
      temp_now: '{{ state_attr(''weather.openweathermap'', ''temperature'') }}'
      umidita: '{{ state_attr(''weather.openweathermap'', ''humidity'') }}'
      vento: '{{ state_attr(''weather.openweathermap'', ''wind_speed'') }}'
      cond: '{{ states(''weather.openweathermap'') }}'
      temp_min: '{{ oggi.get(''templow'', '''') }}'
      temp_max: '{{ oggi.get(''temperature'', '''') }}'
      pioggia: '{{ oggi.get(''precipitation'', 0) }}'
      prob_pioggia: '{{ oggi.get(''precipitation_probability'', 0) }}'
      domani_cond: '{{ domani.get(''condition'', '''') }}'
      domani_min: '{{ domani.get(''templow'', '''') }}'
      domani_max: '{{ domani.get(''temperature'', '''') }}'
      domani_pioggia: '{{ domani.get(''precipitation'', 0) }}'
  - action: rest_command.claude_weather_forecast
    data:
      message: "Sei un assistente meteo. Genera un briefing mattutino breve e naturale
        in italiano, massimo 5 righe, per qualcuno che si trova a {{ states('sensor.posizione_filippo')
        }}. Non usare titoli, intestazioni o markdown. Non iniziare con 'Buongiorno'.
        Dati meteo: condizione {{ cond }}, temperatura attuale {{ temp_now }}°C, min/max
        oggi {{ temp_min }}/{{ temp_max }}°C, umidità {{ umidita }}%, pioggia {{ pioggia
        }}mm (prob {{ prob_pioggia }}%), vento {{ vento }} km/h. Domani: {{ domani_cond
        }}, {{ domani_min }}/{{ domani_max }}°C, pioggia {{ domani_pioggia }}mm. Concludi
        con valutazione per attività all'aperto: \U0001F7E2 Ottimo / \U0001F7E1 Accettabile
        / \U0001F534 Sconsigliato."
    response_variable: claude_response
  - variables:
      testo: "{% set content = claude_response.get('content', {}) %} {% if content
        is mapping %}\n  {{ content.get('content', [{}])[0].get('text', 'Briefing
        non disponibile.') }}\n{% else %}\n  Briefing non disponibile.\n{% endif %}\n"
  - action: telegram_bot.send_message
    data:
      config_entry_id: 01KFE3V7X0K1WR8591R20DGBK7
      message: "\U0001F4CD Buongiorno dall'{{ states('sensor.posizione_filippo') }}!\n\n{{
        testo | trim }}"
