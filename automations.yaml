            - action: PAUSA_ESTENDI_1H
              title: Estendi 1 h
            - action: PAUSA_ESTENDI_3H
              title: Estendi 3 h
      - delay:
          minutes: 15
  - if:
    - condition: state
      entity_id: automation.sicurezza_inserisci_allarme_quando_non_viene_rilevata_presenza_in_casa
